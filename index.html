<body>
<div id="authView" class="auth"><div class="card"><h1>シフト管理</h1><div class="sub">みんなで共有できるシフト管理</div><div id="authMessage" class="notice hidden"></div><label>メールアドレス</label><input id="authEmail" type="email" autocomplete="email"><label>パスワード</label><input id="authPassword" type="password" autocomplete="current-password"><button id="authBtn" class="primary" onclick="submitAuth()">ログイン</button><div class="authSwitch">アカウント登録・パスワード設定は管理者が行います。</div></div></div>
<div id="appView" class="hidden"><header><div class="topbar"><div><h1>シフト管理</h1><div id="roleText" class="sub"></div></div><div><span id="userPill" class="userPill"></span><button class="secondary" onclick="logout()">ログアウト</button></div></div><div class="tabs"><button class="tab active" onclick="showTab('schedule',this)">月間シフト</button><button class="tab" onclick="showTab('requests',this)">希望シフト</button><button id="staffTab" class="tab adminTab" onclick="showTab('staff',this)">スタッフ</button></div></header>
<main id="main" class="">
<section id="schedule"><div class="card month"><button onclick="moveMonth(-1)">‹</button><strong id="title"></strong><button onclick="moveMonth(1)">›</button></div><div class="card"><div style="font-weight:700;font-size:16px;margin-bottom:8px">人数不足日の表示</div><div class="quick"><button id="shortageFirst" onclick="setShortagePeriod('first')">1〜15日</button><button id="shortageSecond" onclick="setShortagePeriod('second')">16日〜月末</button><button id="shortageAll" onclick="setShortagePeriod('all')">1ヶ月</button></div><div id="shortage"></div><div id="shortagePeriodLabel" class="mini"></div><div class="memoBox adminOnly"><input id="memoInput" maxlength="30" placeholder="短いメモ（例：7日 社員休み）"><button class="primary" onclick="addMemo()">メモ追加</button></div><div id="memoList" class="memoList"></div></div><div class="card grid"><table class="table"><thead id="head"></thead><tbody id="body"></tbody></table></div></section>
<section id="requests" class="hidden"><div class="card"><h2>希望シフトを提出</h2><div class="month"><button onclick="moveRequestMonth(-1)">‹</button><strong id="requestMonthTitle"></strong><button onclick="moveRequestMonth(1)">›</button></div><div id="requestHelp" class="mini" style="margin-top:8px"></div><div class="card" style="margin:12px 0;padding:12px;background:#fafafa"><label for="submitPeriodSelect">提出する希望期間</label><select id="submitPeriodSelect" onchange="selectedPeriodId=this.value;renderPeriodInfo()"></select><div id="submitPeriodInfo" class="periodMeta"></div></div><div id="requestDays" class="list" style="margin-top:12px"></div><button class="primary" style="width:100%;margin-top:12px" onclick="submitAllRequests()">希望シフトを提出</button></div><div class="card adminOnly"><h2>管理者：提出された希望</h2><div class="mini" style="margin-bottom:10px">日付ごとに確認して、確定または管理者変更できます。</div><div class="reviewSection"><h3>提出期間の設定</h3><div class="mini">希望を集めたい期間と提出締切を設定できます。</div><div class="periodForm"><div class="full"><label>期間名</label><input id="periodTitle" placeholder="例：10月後半／お盆シフト"></div><div><label>希望開始日</label><input id="periodStart" type="date"></div><div><label>希望終了日</label><input id="periodEnd" type="date"></div><div class="full"><label>提出締切日</label><input id="periodDeadline" type="date"></div></div><button class="primary" style="width:100%" onclick="createShiftPeriod()">提出期間を作成</button><div id="periodAdminMessage" class="notice hidden" style="margin-top:8px"></div></div><div class="reviewSection"><h3>提出状況</h3><label>確認する期間</label><select id="statusPeriodSelect" onchange="statusPeriodId=this.value;renderSubmissionStatus()"></select><div id="submissionStatus"></div></div><div class="reviewToggle"><button id="reviewByDateBtn" class="active" onclick="setReviewMode('date')">📅 日付ごと</button><button id="reviewByStaffBtn" onclick="setReviewMode('staff')">👤 名前ごと</button></div><div id="reviewDatePicker"></div><div id="requestReview"></div></div></section>
<section id="staff" class="staffSection adminOnly">
<div class="card"><h2>スタッフ管理</h2><div class="mini">新人マーク・社員/バイト・スタッフ名を管理します。</div><div id="staffList" class="list" style="margin-top:10px"></div></div>
<div class="card"><h2>スタッフを新規登録</h2><div class="mini">ここから登録すると、ログイン用アカウントも同時に作成されます。</div><label>名前</label><input id="adminNewName" placeholder="例：谷口夢空"><label>メールアドレス</label><input id="adminNewEmail" type="email" placeholder="example@gmail.com" autocomplete="off"><label>初期パスワード（6文字以上）</label><input id="adminNewPassword" type="password" placeholder="6文字以上" autocomplete="new-password"><label>区分</label><select id="adminNewRole"><option value="バイト">バイト</option><option value="社員">社員</option></select><button class="primary" style="width:100%" onclick="adminCreateStaff()">このスタッフを登録</button><div id="adminStaffMessage" class="notice hidden" style="margin-top:10px"></div></div>
</section>
</main></div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="sheet"><h2 id="modalTitle"></h2><label>勤務時間</label><div class="timeRow"><select id="start" onchange="editing&&(editing.status='confirmed')"></select><span>〜</span><select id="end" onchange="editing&&(editing.status='confirmed')"></select></div><div class="quick"><button onclick="quickSet('休み')">休み</button><button onclick="quickSet('18:00〜')">18時〜</button><button onclick="quickSet('20:00〜')">20時〜</button><button onclick="quickSet('LAST')">LAST</button></div><div class="actions"><button class="primary" onclick="saveShift()">保存</button><button class="secondary" onclick="closeModal()">キャンセル</button></div></div></div>

<script>
const SUPABASE_URL='https://eroyuafrsntfszvoplrv.supabase.co';
const SUPABASE_KEY='sb_publishable_TJT6cTkWmPHsjMBusx0r0w__x3f77yG';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,currentStaff=null,state={staff:[],shifts:{},requests:{},confirmed:{},closed:{},weekendLike:{},memos:{},newcomers:{},roles:{},periods:[],submissions:[]};
let viewDate=new Date();viewDate.setDate(1),requestDate=new Date(viewDate);let editing=null,shortagePeriod='first',reviewMode='date',reviewDate=null,selectedPeriodId='',statusPeriodId='';
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function key(s,d){return s+'|'+d}function dk(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function days(y,m){return new Date(y,m+1,0).getDate()}
function fmtDate(k){let [y,m,d]=k.split('-').map(Number),dt=new Date(y,m-1,d);return m+'/'+d+'（'+['日','月','火','水','木','金','土'][dt.getDay()]+'）'}
function timeOptions(last=false){let a=['<option value="">選択</option>'];for(let t=15*60;t<=23*60+45;t+=15){let h=Math.floor(t/60),m=t%60,v=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');a.push(`<option value="${v}">${v}</option>`)}for(let t=0;t<=180;t+=15){let h=Math.floor(t/60),m=t%60,v=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');a.push(`<option value="${v}">${v}</option>`)}if(last)a.push('<option value="LAST">LAST</option>');return a.join('')}
function msg(t){$('authMessage').textContent=t;$('authMessage').classList.remove('hidden')}
async function submitAuth(){let email=$('authEmail').value.trim(),pass=$('authPassword').value;if(!email||!pass){msg('メールアドレスとパスワードを入力してください');return}let {error}=await sb.auth.signInWithPassword({email,password:pass});if(error)msg(error.message)}

async function boot(){let {data:{user}}=await sb.auth.getUser();if(user){currentUser=user;await loadApp()}sb.auth.onAuthStateChange(async (_e,s)=>{currentUser=s?.user||null;if(currentUser)await loadApp();else showAuth()})}
function showAuth(){$('authView').classList.remove('hidden');$('appView').classList.add('hidden')}
async function loadApp(){let {data:me}=await sb.from('staff').select('*').eq('user_id',currentUser.id).eq('active',true).maybeSingle();if(!me){showAuth();msg('スタッフ登録が見つかりません。アカウント登録から名前を登録してください。');return}currentStaff=me;let {data:staff,error:e1}=await sb.from('staff').select('*').eq('active',true).order('created_at');if(e1){alert(e1.message);return}state.staff=staff||[];state.newcomers={};state.roles={};staff.forEach(s=>{state.newcomers[s.name]=!!s.role?.includes('新人')||false;state.roles[s.name]=s.role||'バイト'});let {data:sh}=await sb.from('shifts').select('*');state.shifts={};state.confirmed={};(sh||[]).forEach(r=>{let v=r.status==='off'?'休み':r.start_time?(r.start_time.slice(0,5)+'〜'+(r.is_last?'LAST':r.end_time?r.end_time.slice(0,5):'')):'';if(v){state.shifts[key((staff.find(x=>x.id===r.staff_id)||{}).name,r.shift_date)]=v;if(r.status==='confirmed')state.confirmed[key((staff.find(x=>x.id===r.staff_id)||{}).name,r.shift_date)]=v}});let {data:req}=await sb.from('shift_requests').select('*');state.requests={};(req||[]).forEach(r=>{let s=staff.find(x=>x.id===r.staff_id);if(s)state.requests[key(s.name,r.shift_date)]={status:r.status,start:r.start_time?.slice(0,5)||'',end:r.is_last?'LAST':r.end_time?.slice(0,5)||'',submitted:true,id:r.id}});let {data:dates}=await sb.from('shop_dates').select('*');state.closed={};state.weekendLike={};(dates||[]).forEach(r=>{state.closed[r.date]=!!r.is_closed;state.weekendLike[r.date]=!!r.weekend_like});let {data:memos}=await sb.from('shift_memos').select('*');state.memos={};(memos||[]).forEach(r=>{let month=r.memo_date.slice(0,7);(state.memos[month]??=[]).push({id:r.id,text:r.text})});let {data:periods, error:periodError}=await sb.from('shift_request_periods').select('*').order('period_start',{ascending:false});if(periodError){console.error('period load',periodError.message)}state.periods=periods||[];let {data:submissions, error:submissionError}=await sb.from('shift_request_submissions').select('*');if(submissionError){console.error('submission load',submissionError.message)}state.submissions=submissions||[];$('authView').classList.add('hidden');$('appView').classList.remove('hidden');$('main').classList.toggle('isAdmin',!!currentStaff.is_admin);$('roleText').textContent=currentStaff.is_admin?'管理者モード':'スタッフモード';$('userPill').textContent=currentStaff.name;render();startRealtime();}
async function refresh(){await loadApp()}
function render(){renderSchedule();renderRequestDays();renderRequestReview();renderStaff();renderPeriodControls()}
function renderSchedule(){let y=viewDate.getFullYear(),m=viewDate.getMonth();$('title').textContent=y+'年'+(m+1)+'月';let h='<tr><th>スタッフ</th>';for(let d=1;d<=days(y,m);d++){let k=dk(y,m,d),w=['日','月','火','水','木','金','土'][new Date(y,m,d).getDay()];h+=`<th><button class="dateClosedBtn ${state.closed[k]?'closed':''} ${state.weekendLike[k]?'weekendLike':''}" onclick="${currentStaff.is_admin?`toggleDate(${d})`:'void(0)'}">${d}日(${w})<small>${state.closed[k]?'休業':state.weekendLike[k]?'週末扱い':currentStaff.is_admin?'設定':''}</small></button></th>`}$('head').innerHTML=h+'</tr>';let b='';state.staff.forEach(s=>{b+=`<tr><td class="name">${esc(s.name)}${state.newcomers[s.name]?' 🔰':''}${s.role==='社員'?' <span class="mini">社員</span>':''}</td>`;for(let d=1;d<=days(y,m);d++){let k=dk(y,m,d),v=state.confirmed[key(s.name,k)]||state.shifts[key(s.name,k)]||'';let cell=state.closed[k]?'<span class="shift">休業</span>':v?`<span class="shift">${esc(v)}</span>`:'<span class="off">—</span>';b+=`<td ${currentStaff.is_admin&&!state.closed[k]?`onclick="openMonthlyEdit('${s.id}','${k}')" class="editableCell" title="タップして変更"`:''}>${cell}</td>`}b+='</tr>'});$('body').innerHTML=b;let bad=[];for(let d=1;d<=days(y,m);d++){let inP=shortagePeriod==='all'||shortagePeriod==='first'&&d<=15||shortagePeriod==='second'&&d>=16;if(!inP)continue;let k=dk(y,m,d);if(state.closed[k])continue;let day=new Date(y,m,d).getDay(),week=day===0||day===5||day===6||state.weekendLike[k],req=week?4:3,lastReq=week?2:1;let workers=state.staff.filter(s=>s.role!=='社員').map(s=>state.shifts[key(s.name,k)]||'').filter(Boolean);let n=workers.filter(v=>v!=='休み').length,last=workers.filter(v=>v==='LAST'||v.endsWith('〜LAST')).length;let x=[];if(n<req)x.push('ホール'+(req-n)+'人不足');if(last<lastReq)x.push('ラスト'+(lastReq-last)+'人不足');if(x.length)bad.push(fmtDate(k)+' '+x[0]+(x[1]?'（'+x[1]+'）':''));}$('shortage').innerHTML=bad.length?'<span class="badge warn">⚠ 人数不足</span> '+bad.join('・'):'<span class="badge ok">✓ 人数OK</span>';$('shortageFirst').classList.toggle('active',shortagePeriod==='first');$('shortageSecond').classList.toggle('active',shortagePeriod==='second');$('shortageAll').classList.toggle('active',shortagePeriod==='all');$('shortagePeriodLabel').textContent=shortagePeriod==='first'?'現在：1〜15日の不足日を表示':shortagePeriod==='second'?'現在：16日〜月末の不足日を表示':'現在：1ヶ月分の不足日を表示';renderMemos()}
function renderMemos(){let a=state.memos[viewDate.getFullYear()+'-'+String(viewDate.getMonth()+1).padStart(2,'0')]||[];$('memoList').innerHTML=a.map(x=>`<div class="memoItem"><span>📝 ${esc(x.text)}</span>${currentStaff.is_admin?`<button onclick="deleteMemo('${x.id}')">削除</button>`:''}</div>`).join('')}
async function addMemo(){let t=$('memoInput').value.trim();if(!t)return;let d=dk(viewDate.getFullYear(),viewDate.getMonth(),1);let {error}=await sb.from('shift_memos').insert({memo_date:d,text:t});if(error)alert(error.message);else{$('memoInput').value='';await refresh()}}

function moveRequestMonth(n){requestDate.setMonth(requestDate.getMonth()+n);reviewDate=null;renderRequestDays();if(currentStaff?.is_admin)renderRequestReview()}
function showTab(id,btn){if(id==='staff'&&!currentStaff?.is_admin)return;['schedule','requests','staff'].forEach(x=>{let el=$(x);el.classList.toggle('hidden',x!==id);if(x==='staff')el.classList.toggle('active',x===id&&!!currentStaff?.is_admin)});document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(id==='requests'){renderRequestDays();renderRequestReview()}if(id==='staff'){renderStaff()}}
function renderRequestDays(){let y=requestDate.getFullYear(),m=requestDate.getMonth(),html='';$('requestMonthTitle').textContent=y+'年'+(m+1)+'月';$('requestHelp').textContent=currentStaff.role==='社員'?'社員は出勤・休みだけを登録します。':'希望時間を入力してください。15:00〜3:00が基本で、任意時間も入力できます。';for(let d=1;d<=days(y,m);d++){let k=dk(y,m,d);if(state.closed[k])continue;let r=state.requests[key(currentStaff.name,k)]||{status:'',start:'',end:''},confirmed=state.confirmed[key(currentStaff.name,k)];html+=`<div class="requestDay"><strong class="requestDateLabel">${fmtDate(k)}</strong><div><div class="requestControls"><button class="${r.status==='work'?'active':''}" onclick="setRequest('${k}','work')">出勤</button><button class="${r.status==='off'?'active':''}" onclick="setRequest('${k}','off')">休み</button></div>${currentStaff.role==='社員'?'':`<div class="requestTimes"><select id="rs_${d}" onchange="requestTime('${k}','start',this.value)" ${r.status!=='work'||confirmed?'disabled':''}>${timeOptions()}</select><select id="re_${d}" onchange="requestTime('${k}','end',this.value)" ${r.status!=='work'||confirmed?'disabled':''}>${timeOptions(true)}</select></div>`}${confirmed?'<div class="mini">🔒 確定済み</div>':''}</div></div>`}$('requestDays').innerHTML=html;for(let d=1;d<=days(y,m);d++){let k=dk(y,m,d);if(state.closed[k])continue;let r=state.requests[key(currentStaff.name,k)]||{};if(currentStaff.role!=='社員'){let a=$('rs_'+d),b=$('re_'+d);if(a)a.value=r.start||'';if(b)b.value=r.end||''}}}async function setRequest(k,status){let existing=state.requests[key(currentStaff.name,k)]||{};if(state.confirmed[key(currentStaff.name,k)]){alert('確定済みのシフトは変更できません');return}let payload={staff_id:currentStaff.id,shift_date:k,status,start_time:null,end_time:null,is_last:false,note:null};if(status==='work'){payload.start_time=existing.start||null;payload.end_time=existing.end==='LAST'?null:existing.end||null;payload.is_last=existing.end==='LAST'}let {error}=await sb.from('shift_requests').upsert(payload,{onConflict:'staff_id,shift_date'});if(error)alert(error.message);else await refresh()}
async function requestTime(k,type,v){if(v==='')return;let r=state.requests[key(currentStaff.name,k)]||{};r[type]=v;let {error}=await sb.from('shift_requests').update({start_time:r.start||null,end_time:r.end&&r.end!=='LAST'?r.end:null,is_last:r.end==='LAST'}).eq('id',r.id);if(error)alert(error.message);else await refresh()}
async function submitAllRequests(){
  if(!selectedPeriodId){alert('提出期間が設定されていません。管理者に確認してください。');return}
  const period=state.periods.find(p=>p.id===selectedPeriodId);
  if(!period){alert('提出期間を選び直してください。');return}
  const today=new Date();today.setHours(0,0,0,0);
  const deadline=new Date(period.deadline+'T00:00:00');
  if(today>deadline && !confirm('提出締切日を過ぎています。それでも提出しますか？'))return;
  const existing=state.submissions.find(x=>x.period_id===period.id&&x.staff_id===currentStaff.id);
  if(existing){
    alert('この期間は提出済みです。希望を変更しても提出状況はそのままです😊');
    return;
  }
  const {error}=await sb.from('shift_request_submissions').insert({period_id:period.id,staff_id:currentStaff.id});
  if(error){
    if(String(error.code)==='23505'){alert('この期間はすでに提出済みです😊');await refresh();return}
    alert('提出状況の保存に失敗しました。\\n'+error.message);return;
  }
  await refresh();
  alert('希望シフトを提出しました！\\n提出状況に記録しました😊');
}
function dateJa(s){if(!s)return '';const [y,m,d]=s.split('-').map(Number);return `${m}/${d}`;}
function renderPeriodControls(){
  const active=state.periods.filter(p=>p.is_active);
  const sel=$('submitPeriodSelect');
  if(sel){
    if(!active.some(p=>p.id===selectedPeriodId))selectedPeriodId=active[0]?.id||'';
    sel.innerHTML=active.length?active.map(p=>`<option value="${p.id}" ${p.id===selectedPeriodId?'selected':''}>${esc(p.title)}（${dateJa(p.period_start)}〜${dateJa(p.period_end)}）</option>`).join(''):'<option value="">提出期間が設定されていません</option>';
    sel.value=selectedPeriodId;
  }
  const statusSel=$('statusPeriodSelect');
  if(statusSel && currentStaff?.is_admin){
    if(!state.periods.some(p=>p.id===statusPeriodId))statusPeriodId=state.periods[0]?.id||'';
    statusSel.innerHTML=state.periods.length?state.periods.map(p=>`<option value="${p.id}" ${p.id===statusPeriodId?'selected':''}>${esc(p.title)}（${dateJa(p.period_start)}〜${dateJa(p.period_end)}）</option>`).join(''):'<option value="">まだ期間がありません</option>';
    statusSel.value=statusPeriodId;
  }
  renderPeriodInfo();
  renderSubmissionStatus();
}
function renderPeriodInfo(){
  const p=state.periods.find(x=>x.id===selectedPeriodId),el=$('submitPeriodInfo');
  if(!el)return;
  if(!p){el.textContent='管理者が提出期間を設定すると、ここから提出できます。';return}
  const submitted=state.submissions.some(x=>x.period_id===p.id&&x.staff_id===currentStaff?.id);
  el.textContent=`希望対象：${p.period_start}〜${p.period_end} ／ 締切：${p.deadline} ／ ${submitted?'提出済み':'未提出'}`;
}
function renderSubmissionStatus(){
  const box=$('submissionStatus');if(!box||!currentStaff?.is_admin)return;
  const p=state.periods.find(x=>x.id===statusPeriodId);
  if(!p){box.innerHTML='<div class="mini" style="padding:10px 0">提出期間を作成すると、全スタッフの提出状況を確認できます。</div>';return}
  const submittedIds=new Set(state.submissions.filter(x=>x.period_id===p.id).map(x=>x.staff_id));
  const submitted=state.staff.filter(s=>submittedIds.has(s.id));
  const missing=state.staff.filter(s=>!submittedIds.has(s.id));
  box.innerHTML=`<div class="periodMeta">希望対象：${p.period_start}〜${p.period_end} ／ 締切：${p.deadline}</div><div class="periodStatusRow"><b>提出済み</b><span class="badge ok">${submitted.length}人</span></div><div class="periodStatusRow"><b>未提出</b><span class="badge warn">${missing.length}人</span></div>${missing.length?`<div style="margin-top:8px"><b>未提出スタッフ</b>${missing.map(s=>`<div class="periodStatusRow"><span class="statusName">${state.newcomers[s.name]?'🔰 ':''}${esc(s.name)}</span><span class="badge warn">未提出</span></div>`).join('')}</div>`:'<div class="mini" style="margin-top:8px">全員提出済みです！</div>'}`;
}
async function createShiftPeriod(){
  if(!currentStaff?.is_admin)return;
  const title=$('periodTitle').value.trim(),start=$('periodStart').value,end=$('periodEnd').value,deadline=$('periodDeadline').value,box=$('periodAdminMessage');
  box.classList.add('hidden');
  if(!title||!start||!end||!deadline){box.textContent='期間名・開始日・終了日・締切日をすべて入力してください。';box.classList.remove('hidden');return}
  if(end<start){box.textContent='終了日は開始日以降にしてください。';box.classList.remove('hidden');return}
  const {data,error}=await sb.from('shift_request_periods').insert({title,period_start:start,period_end:end,deadline,created_by:currentUser.id,is_active:true}).select().single();
  if(error){box.textContent='期間を作成できませんでした：'+error.message;box.classList.remove('hidden');return}
  $('periodTitle').value='';$('periodStart').value='';$('periodEnd').value='';$('periodDeadline').value='';
  await refresh();
  selectedPeriodId=data.id;statusPeriodId=data.id;renderPeriodControls();
  box.textContent='提出期間を作成しました。';box.classList.remove('hidden');
}

function setReviewMode(m){reviewMode=m;$('reviewByDateBtn').classList.toggle('active',m==='date');$('reviewByStaffBtn').classList.toggle('active',m==='staff');renderRequestReview()}
function renderReviewDatePicker(dates){
  if(!dates.length){$('reviewDatePicker').innerHTML='';return}
  if(!reviewDate||!dates.includes(reviewDate))reviewDate=dates[0];
  $('reviewDatePicker').innerHTML=`<div class="reviewDateSelect"><label style="white-space:nowrap;font-weight:700">確認する日付</label><select id="reviewDateSelect" onchange="reviewDate=this.value;renderRequestReview()">${dates.map(d=>`<option value="${d}" ${d===reviewDate?'selected':''}>${fmtDate(d)}</option>`).join('')}</select></div>`;
}
function reviewHtml(s,k,r){let label=r.status==='off'?'休み':`${r.start||''}〜${r.end||''}`;return `<div class="reviewPerson"><div><div class="reviewPersonName">${state.newcomers[s]?'🔰 ':''}${esc(s)}</div></div><div class="reviewPersonTime">${esc(label)}</div><div class="reviewPersonActions"><button class="reviewConfirm" onclick="confirmRequest('${s}','${k}')">この希望で確定</button><button class="reviewEdit" onclick="editAndConfirm('${s}','${k}')">時間を変更して確定</button></div></div>`}
function confirmedHtml(s,k,v){return `<div class="reviewPerson"><div><div class="reviewPersonName">${state.newcomers[s]?'🔰 ':''}${esc(s)}</div><div class="reviewLocked">🔒 確定：${esc(v)}</div></div><div class="reviewPersonActions"><button class="reviewEdit" onclick="adminEdit('${s}','${k}')">確定を変更</button></div></div>`}
function renderRequestReview(){
  if(!currentStaff?.is_admin)return;
  let entries=Object.entries(state.requests).filter(([k,r])=>r.submitted).map(([k,r])=>{let [s,d]=k.split('|');return{s,d,r}});
  let y=requestDate.getFullYear(),m=requestDate.getMonth();let allDates=Array.from({length:days(y,m)},(_,i)=>dk(y,m,i+1));
  if(reviewMode==='staff'){
    $('reviewDatePicker').innerHTML='';
    if(!entries.length){$('requestReview').innerHTML='<span class="off">まだ提出された希望はありません。</span>';return}
    let bs={};entries.forEach(x=>(bs[x.s]??=[]).push(x));
    $('requestReview').innerHTML=Object.keys(bs).sort().map(s=>`<div class="reviewDate"><div class="reviewDateHead"><span class="reviewDateTitle">${state.newcomers[s]?'🔰 ':''}${esc(s)}</span><span class="reviewCount">${bs[s].length}日</span></div>${bs[s].sort((a,b)=>a.d.localeCompare(b.d)).map(x=>reviewHtml(s,x.d,x.r)).join('')}</div>`).join('');
    return;
  }
  renderReviewDatePicker(allDates);
  if(!reviewDate){$('requestReview').innerHTML='<span class="off">まだ提出された希望はありません。</span>';return}
  let dayRequests=entries.filter(x=>x.d===reviewDate);
  let confirmed=state.staff.map(s=>{let v=state.confirmed[key(s.name,reviewDate)];return v?{s,v}:null}).filter(Boolean);
  let pending=dayRequests.filter(x=>!state.confirmed[key(x.s,x.d)]);
  let reqWork=dayRequests.filter(x=>x.r.status==='work').length;
  let reqLast=dayRequests.filter(x=>x.r.status==='work'&&x.r.end==='LAST').length;
  let html=`<div class="reviewSection"><h3>🔒 ${fmtDate(reviewDate)}の確定シフト</h3><div class="mini">確定 ${confirmed.length}人</div>${confirmed.length?confirmed.map(x=>confirmedHtml(x.s.name,reviewDate,x.v)).join(''):'<div class="off" style="padding-top:8px">まだ確定シフトはありません。</div>'}</div>`;
  html+=`<div class="reviewSection"><h3>📝 ${fmtDate(reviewDate)}の希望シフト</h3><div class="mini">希望 ${dayRequests.length}人 ・ 出勤 ${reqWork}人 ・ LAST ${reqLast}人</div>${pending.length?pending.map(x=>reviewHtml(x.s,x.d,x.r)).join(''):'<div class="ok" style="padding-top:8px">未確定の希望はありません。</div>'}</div>`;
  $('requestReview').innerHTML=html;
}
async function confirmRequest(s,k){if(!currentStaff.is_admin)return;let r=state.requests[key(s,k)],st=state.staff.find(x=>x.name===s);if(!r||!st)return;let {error}=await sb.from('shifts').upsert({staff_id:st.id,shift_date:k,status:r.status==='off'?'off':'confirmed',start_time:r.start||null,end_time:r.end&&r.end!=='LAST'?r.end:null,is_last:r.end==='LAST',note:r.note||null},{onConflict:'staff_id,shift_date'});if(error)alert(error.message);else await refresh()}
function editAndConfirm(s,k){
  let r=state.requests[key(s,k)];if(!r)return;
  let st=state.staff.find(x=>x.name===s);if(!st)return;
  editing={staffId:st.id,shiftDate:k,status:r.status,start:r.start||'',end:r.end||'',fromRequest:true};
  openEditModal('希望を変更して確定',editing);
}
function adminEdit(s,k){
  let st=state.staff.find(x=>x.name===s);if(!st)return;
  let v=state.confirmed[key(s,k)]||state.shifts[key(s,k)]||'';
  let m=v.match(/^(\d{2}:\d{2})〜(.*)$/);
  editing={staffId:st.id,shiftDate:k,status:v==='休み'?'off':'confirmed',start:m?.[1]||'',end:m?.[2]||'',fromRequest:false};
  openEditModal('確定シフトを変更',editing);
}
function openMonthlyEdit(staffId,k){
  if(!currentStaff?.is_admin)return;
  let st=state.staff.find(x=>x.id===staffId);if(!st)return;
  let v=state.confirmed[key(st.name,k)]||state.shifts[key(st.name,k)]||'';
  let m=v.match(/^(\d{2}:\d{2})〜(.*)$/);
  editing={staffId,shiftDate:k,status:v==='休み'?'off':'confirmed',start:m?.[1]||'',end:m?.[2]||'',fromRequest:false};
  openEditModal(`${st.name} ${fmtDate(k)}を変更`,editing);
}
function openEditModal(title,x){
  $('modalTitle').textContent=title;
  $('start').value=x.start||'';$('end').value=x.end||'';
  $('modal').classList.remove('hidden');
}
async function saveShift(){
  if(!editing||!currentStaff?.is_admin){closeModal();return}
  let status=editing.status==='off'?'off':'confirmed',start=$('start').value||null,end=$('end').value||null,isLast=end==='LAST';
  if(status!=='off'&&!start){alert('開始時間を選択してください');return}
  const {error}=await sb.from('shifts').upsert({staff_id:editing.staffId,shift_date:editing.shiftDate,status,start_time:status==='off'?null:start,end_time:status==='off'||isLast?null:end,is_last:status==='off'?false:isLast,updated_at:new Date().toISOString()},{onConflict:'staff_id,shift_date'});
  if(error){alert(error.message);return}
  closeModal();await refresh();
}
function quickSet(v){
  if(!editing)return;
  if(v==='休み'){editing.status='off';$('start').value='';$('end').value='';return}
  editing.status='confirmed';
  if(v==='18:00〜'){$('start').value='18:00';$('end').value='';}
  if(v==='20:00〜'){$('start').value='20:00';$('end').value='';}
  if(v==='LAST'){$('start').value='18:00';$('end').value='LAST';}
}
function renderStaff(){if(!currentStaff?.is_admin)return;$('staffList').innerHTML=state.staff.map(s=>`<div class="staffRow"><div><b>${state.newcomers[s.name]?'🔰 ':''}${esc(s.name)}</b><div class="mini">${s.role||'バイト'} ${s.is_admin?'・管理者':''}</div></div><button class="secondary" onclick="renameStaff('${s.id}','${esc(s.name)}')">名前変更</button><button class="newcomerBtn" onclick="toggleNewcomer('${s.id}',${!state.newcomers[s.name]})">${state.newcomers[s.name]?'新人解除':'新人にする'}</button><button class="roleBtn ${s.role==='社員'?'admin':''}" onclick="toggleRole('${s.id}','${s.role==='社員'?'バイト':'社員'}')">${s.role==='社員'?'社員→バイト':'バイト→社員'}</button><button class="deleteStaffBtn" onclick="deleteStaff('${s.id}','${esc(s.name)}')">削除</button></div>`).join('')}
async function toggleNewcomer(id,v){await sb.from('staff').update({role:v?'新人':'バイト'}).eq('id',id);await refresh()}
async function toggleRole(id,role){await sb.from('staff').update({role}).eq('id',id);await refresh()}
async function renameStaff(id,currentName){
  if(!currentStaff?.is_admin)return;
  const n=prompt('新しいスタッフ名',currentName);
  if(n===null)return;
  const name=n.trim();
  if(!name||name===currentName)return;
  const {error}=await sb.from('staff').update({name}).eq('id',id);
  if(error)alert(error.message);else await refresh();
}

async function deleteStaff(id,name){
  if(!currentStaff?.is_admin)return;
  if(!confirm(`${name}さんをスタッフ一覧から削除しますか？\n過去のシフトデータは残ります。`))return;
  const {error}=await sb.from('staff').update({active:false}).eq('id',id);
  if(error)alert(error.message);else await refresh();
}
async function addStaff(){return adminCreateStaff()}
async function adminCreateStaff(){
  if(!currentStaff?.is_admin){alert('管理者としてログインしてください');return}
  const name=$('adminNewName').value.trim();
  const email=$('adminNewEmail').value.trim();
  const password=$('adminNewPassword').value;
  const role=$('adminNewRole').value;
  const box=$('adminStaffMessage');
  box.classList.add('hidden');
  if(!name||!email||!password){box.textContent='名前・メールアドレス・パスワードを入力してください';box.classList.remove('hidden');return}
  if(password.length<6){box.textContent='パスワードは6文字以上にしてください';box.classList.remove('hidden');return}
  const {data:{session}}=await sb.auth.getSession();
  if(!session){box.textContent='管理者としてログインし直してください';box.classList.remove('hidden');return}
  box.textContent='登録中…';box.classList.remove('hidden');
  try{
    const res=await fetch(SUPABASE_URL+'/functions/v1/admin-create-staff',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({name,email,password,role})});
    const text=await res.text();
    let out={};try{out=JSON.parse(text)}catch(e){out={error:text}}
    if(!res.ok||out.error){box.textContent=out.error||'登録に失敗しました';return}
    box.textContent=out.message||'登録しました';
    $('adminNewName').value='';$('adminNewEmail').value='';$('adminNewPassword').value='';
    await refresh();
  }catch(e){
    box.textContent='通信エラー：'+(e?.message||e);
  }
}
function initTimes(){$('start').innerHTML=timeOptions();$('end').innerHTML=timeOptions(true)}
function closeModal(){$('modal').classList.add('hidden');editing=null}
let realtimeChannel=null;
function startRealtime(){
  if(realtimeChannel)sb.removeChannel(realtimeChannel);
  realtimeChannel=sb.channel('shift-management-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'shifts'},()=>refresh())
    .on('postgres_changes',{event:'*',schema:'public',table:'shift_requests'},()=>refresh())
    .on('postgres_changes',{event:'*',schema:'public',table:'shop_dates'},()=>refresh())
    .on('postgres_changes',{event:'*',schema:'public',table:'shift_request_periods'},()=>refresh())
    .on('postgres_changes',{event:'*',schema:'public',table:'shift_request_submissions'},()=>refresh())
    .subscribe();
}
initTimes();
boot();
// 他の端末で変更されたシフトを自動反映（Supabase Realtimeに依存しない簡易同期）
setInterval(async()=>{
  if(document.visibilityState==='visible' && currentUser && currentStaff){
    try{ await loadApp(); }catch(e){ console.error('auto refresh',e); }
  }
},5000);
</script></body></html>
