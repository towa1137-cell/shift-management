<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>シフト管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.wrap{max-width:980px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #0000000d}h1{font-size:24px;margin:0 0 12px}.top{position:sticky;top:0;z-index:10;background:#fff;padding:14px 14px 10px;border-bottom:1px solid #eee}.tabs{display:flex;gap:8px;overflow:auto}.tab,.pill{background:#eee;padding:10px 14px;border-radius:22px;font-weight:700;white-space:nowrap}.tab.active,.pill.active,.primary{background:#222;color:#fff}.month{display:flex;justify-content:space-between;align-items:center;gap:10px}.month button{background:#eee;border-radius:10px;padding:8px 16px;font-size:22px}.grid{overflow:auto}.table{border-collapse:collapse;min-width:850px;width:100%}th,td{border:1px solid #e5e5e5;padding:7px;text-align:center;white-space:nowrap}th{background:#fafafa}.name{position:sticky;left:0;background:#fff;text-align:left;font-weight:800;z-index:2}.shift{display:inline-block;background:#eaf4ff;border-radius:8px;padding:5px 7px;font-size:12px}.confirmed{background:#e8f7ed;color:#17833b}.off{color:#aaa}.warn{background:#fff0f0;color:#c33}.ok{background:#e8f7ed;color:#17833b}.muted{color:#777;font-size:12px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.btn{padding:10px 13px;border-radius:10px;background:#eee;font-weight:700}.danger{color:#c33;background:#fff0f0}.input,select,input{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;background:#fff;margin:5px 0 9px}.list{display:flex;flex-direction:column;gap:8px}.requestDay,.reviewDate,.staffRow{border:1px solid #e7e7e7;border-radius:14px;padding:12px}.requestDay{display:grid;grid-template-columns:54px 1fr;gap:10px}.requestControls{display:grid;grid-template-columns:1fr 1fr;gap:6px}.requestControls button{padding:9px;border-radius:9px;background:#eee;font-weight:700}.requestControls .active{background:#222;color:#fff}.times{display:grid;grid-template-columns:1fr 1fr;gap:6px}.reviewDate{margin-bottom:10px}.reviewHead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}.reviewPerson{display:grid;grid-template-columns:1fr auto;gap:5px;padding:10px 0;border-top:1px solid #eee}.reviewActions{grid-column:1/-1;display:flex;gap:6px}.reviewActions button{flex:1;padding:8px;border-radius:9px;font-size:12px;font-weight:700}.reviewSection{border:1px solid #e7e7e7;border-radius:14px;padding:12px;margin-bottom:10px}.reviewSection h3{font-size:15px;margin:0 0 4px}.reviewDateSelect{display:flex;gap:8px;align-items:center;margin-bottom:10px}.reviewDateSelect select{margin:0}.reviewHint{font-size:12px;color:#777;margin:0 0 10px}.modal{position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:flex-end}.sheet{background:#fff;width:100%;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px}.auth{max-width:460px;margin:10vh auto}.auth h1{text-align:center}.msg{padding:10px;border-radius:10px;background:#f0f3f7;margin:8px 0;font-size:13px}.msg.err{background:#fff0f0;color:#b22}.code{font-size:22px;letter-spacing:3px;font-weight:900;background:#f5f6f8;padding:12px;border-radius:10px;text-align:center}.dateBtn{background:transparent;font-weight:800;padding:4px;border-radius:8px}.dateBtn.closed{background:#eee;color:#888}.mini{font-size:10px;color:#777;display:block}.stat{display:flex;gap:7px;flex-wrap:wrap}.badge{border-radius:14px;padding:5px 9px;background:#eee;font-size:12px;font-weight:700}.badge.warn{background:#fff0f0;color:#c33}.badge.ok{background:#e8f7ed;color:#17833b}.adminTag{background:#222;color:#fff;border-radius:12px;padding:4px 8px;font-size:11px}.footer{padding:20px;text-align:center;color:#888;font-size:11px}
</style>
</head>
<body>
<div id="authView" class="wrap auth hidden"><div class="card"><h1>シフト管理</h1><p class="muted">スタッフと管理者で共有するシフト管理です。</p><div class="tabs"><button id="loginTab" class="tab active" onclick="setAuthMode('login')">ログイン</button><button id="signupTab" class="tab" onclick="setAuthMode('signup')">新規登録</button></div><div id="authNameBox" class="hidden"><label>名前</label><input id="authName" placeholder="例：葵"></div><label>メールアドレス</label><input id="authEmail" type="email" autocomplete="email" placeholder="example@mail.com"><label>パスワード</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="6文字以上"><button id="authBtn" class="btn primary" style="width:100%;margin-top:4px" onclick="authSubmit()">ログイン</button><div id="authMsg"></div></div></div>
<div id="appView" class="hidden"><header class="top"><div class="wrap" style="padding:0"><div class="row"><h1 style="flex:1">シフト管理</h1><span id="roleBadge"></span><button class="btn" onclick="logout()">ログアウト</button></div><div class="tabs"><button class="tab active" onclick="showTab('schedule',this)">月間シフト</button><button class="tab" onclick="showTab('requests',this)">希望シフト</button><button id="staffTab" class="tab" onclick="showTab('staff',this)">スタッフ</button></div></div></header>
<main class="wrap">
<section id="schedule"><div class="card month"><button onclick="moveMonth(-1)">‹</button><strong id="monthTitle"></strong><button onclick="moveMonth(1)">›</button></div><div class="card"><b>人数不足チェック</b><div class="muted" style="margin:5px 0 9px">確定済みシフトを日付ごとに集計します。</div><div id="shortage"></div></div><div class="card grid"><table class="table"><thead id="scheduleHead"></thead><tbody id="scheduleBody"></tbody></table></div></section>
<section id="requests" class="hidden"><div id="staffRequestCard" class="card"><h2>希望シフトを提出</h2><div class="month"><button onclick="moveRequestMonth(-1)">‹</button><strong id="requestMonthTitle"></strong><button onclick="moveRequestMonth(1)">›</button></div><div id="requestDays" class="list" style="margin-top:12px"></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="submitRequests()">この月の希望を提出</button></div><div id="adminReviewCard" class="card hidden"><div class="row"><div><h2 style="margin:0">管理者：提出された希望</h2><div class="muted">日付ごとに確認できるので、見落としを防げます。</div></div></div><div class="tabs" style="margin:12px 0"><button id="reviewDateBtn" class="tab active" onclick="setReviewMode('date')">📅 日付ごと</button><button id="reviewStaffBtn" class="tab" onclick="setReviewMode('staff')">👤 名前ごと</button></div><div id="reviewDatePicker"></div><div id="requestReview"></div></div></section>
<section id="staff" class="hidden"><div class="card"><h2>スタッフ管理</h2><p class="muted">管理者がスタッフ名を登録し、招待コードを渡します。</p><div class="row"><input id="newStaffName" placeholder="スタッフ名"><button class="btn primary" onclick="addStaff()">追加</button></div><div id="staffList" class="list"></div></div></section>
</main><div class="footer">シフト管理・共有版</div></div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="sheet"><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<script>
const SUPABASE_URL='https://fyksteutqokqsnyrnvgq.supabase.co';
const SUPABASE_KEY='sb_publishable_s7VHnbYrvf9kijTnsUFTBw_AbcQ9OWi';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let session=null,me=null,isAdmin=false,staff=[],requests=[],shifts=[],closed=[],settings={required_staff:3},month=new Date(new Date().getFullYear(),new Date().getMonth(),1),requestMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1),authMode='login',reviewMode='date',reviewEditKey=null,reviewDate=null;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dateKey(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function days(y,m){return new Date(y,m+1,0).getDate()}
function fmtDate(d){const x=new Date(d+'T00:00:00');return `${x.getMonth()+1}/${x.getDate()}（${['日','月','火','水','木','金','土'][x.getDay()]}）`}
function timeLabel(x){if(!x)return '';return String(x).slice(0,5)}
function shiftLabel(x){if(!x)return '';if(x.status==='off')return '休み';return `${timeLabel(x.start_time)}〜${x.is_last?'LAST':timeLabel(x.end_time)}`}
function setAuthMode(m){authMode=m;$('loginTab').classList.toggle('active',m==='login');$('signupTab').classList.toggle('active',m==='signup');$('authNameBox').classList.toggle('hidden',m!=='signup');$('authBtn').textContent=m==='login'?'ログイン':'アカウント作成';$('authMsg').innerHTML=''}
async function authSubmit(){const email=$('authEmail').value.trim(),password=$('authPassword').value,name=$('authName').value.trim();if(!email||password.length<6||(authMode==='signup'&&!name)){return msg('authMsg','必要項目を入力してください。',true)}$('authBtn').disabled=true;let r;if(authMode==='login')r=await db.auth.signInWithPassword({email,password});else r=await db.auth.signUp({email,password});$('authBtn').disabled=false;if(r.error)return msg('authMsg',r.error.message,true);if(authMode==='signup'&&!r.data.session)return msg('authMsg','確認メールを確認してからログインしてください。',false);await boot()}
function msg(id,text,err=false){$(id).innerHTML=`<div class="msg ${err?'err':''}">${esc(text)}</div>`}
async function logout(){await db.auth.signOut()}
async function boot(){const s=await db.auth.getSession();session=s.data.session;if(!session){$('authView').classList.remove('hidden');$('appView').classList.add('hidden');return}await loadAll();}
db.auth.onAuthStateChange(async()=>{const s=await db.auth.getSession();session=s.data.session;if(session)await loadAll();else{$('authView').classList.remove('hidden');$('appView').classList.add('hidden')}});
async function loadAll(){const [a,b,c,d,e]=await Promise.all([db.from('staff').select('*').eq('active',true).order('created_at'),db.from('shift_requests').select('*'),db.from('shifts').select('*'),db.from('closed_dates').select('*'),db.from('shift_settings').select('*').eq('id',1).maybeSingle()]);if(a.error||b.error||c.error||d.error)return showError((a.error||b.error||c.error||d.error).message);staff=a.data||[];requests=b.data||[];shifts=c.data||[];closed=d.data||[];settings=e.data||{required_staff:3};me=staff.find(x=>x.user_id===session.user.id)||null;isAdmin=!!me?.is_admin;renderApp();}
function renderApp(){$('authView').classList.add('hidden');$('appView').classList.remove('hidden');$('roleBadge').innerHTML=me?(isAdmin?'<span class="adminTag">管理者</span>':`<span class="badge">${esc(me.name)}</span>`):'<span class="badge warn">未登録</span>';$('staffTab').classList.toggle('hidden',!isAdmin);if(!me){renderClaim();return}renderSchedule();renderRequests();if(isAdmin)renderStaff();}
function renderClaim(){
 showTab('requests',document.querySelector('.top .tab:nth-child(2)'));
 if(staff.length===0){
  $('staffRequestCard').innerHTML='<div class="card"><h2>最初の管理者を登録</h2><p>このシフト管理はまだ誰も登録されていません。あなたを最初の管理者として登録します。</p><input id="bootstrapName" placeholder="管理者名（例：葵）"><button class="btn primary" style="width:100%" onclick="bootstrapAdmin()">管理者として開始</button><hr><p class="muted">スタッフとして参加する場合は、管理者から招待コードをもらってください。</p></div>';
 }else{
  $('staffRequestCard').innerHTML='<div class="card"><h2>スタッフ登録</h2><p>管理者から受け取った招待コードを入力してください。</p><input id="claimCode" placeholder="招待コード"><button class="btn primary" style="width:100%" onclick="claimStaff()">スタッフ登録</button></div>';
 }
 $('adminReviewCard').classList.add('hidden');
}
async function bootstrapAdmin(){const name=$('bootstrapName').value.trim();if(!name)return;const {error}=await db.rpc('bootstrap_admin',{p_name:name});if(error)return alert(error.message);await loadAll();alert('管理者として登録しました😊')}
async function claimStaff(){const code=$('claimCode').value.trim();if(!code)return;const {error}=await db.rpc('claim_staff',{p_invite_code:code});if(error)return alert(error.message);await loadAll();alert('スタッフ登録しました😊')}
function renderSchedule(){
 const y=month.getFullYear(),m=month.getMonth();
 $('monthTitle').textContent=`${y}年${m+1}月`;
 let h='<tr><th>スタッフ</th>';
 for(let d=1;d<=days(y,m);d++){
  const dk=dateKey(y,m,d),c=closed.find(x=>x.shift_date===dk),w=['日','月','火','水','木','金','土'][new Date(y,m,d).getDay()];
  h+=`<th><button class="dateBtn ${c?'closed':''}" onclick="toggleClosed('${dk}')">${d}日(${w})<span class="mini">${c?'休業':'管理者のみ休業設定'}</span></button></th>`;
 }
 $('scheduleHead').innerHTML=h+'</tr>';
 let b='';
 staff.forEach(s=>{
  b+=`<tr><td class="name">${s.is_newcomer?'🔰 ':''}${esc(s.name)}</td>`;
  for(let d=1;d<=days(y,m);d++){
   const dk=dateKey(y,m,d),x=shifts.find(q=>q.staff_id===s.id&&q.shift_date===dk),c=closed.find(q=>q.shift_date===dk);
   let cell='<span class="off">—</span>';
   if(c) cell='<span class="shift">休業</span>';
   else if(x){ const click=isAdmin?` onclick="editShift('${s.id}','${dk}')" style="cursor:pointer"`:''; cell=`<span class="shift confirmed"${click}>${esc(shiftLabel(x))}</span>`; }
   b+=`<td>${cell}</td>`;
  }
  b+='</tr>';
 });
 $('scheduleBody').innerHTML=b;
 renderShortage();
}
function renderShortage(){const y=month.getFullYear(),m=month.getMonth();let out=[];for(let d=1;d<=days(y,m);d++){const dk=dateKey(y,m,d);if(closed.some(x=>x.shift_date===dk))continue;const wd=new Date(y,m,d).getDay(),req=(wd===0||wd===5||wd===6)?4:3,lastReq=(wd===0||wd===5||wd===6)?2:1,work=shifts.filter(x=>x.shift_date===dk&&x.status!=='off').length,last=shifts.filter(x=>x.shift_date===dk&&x.status!=='off'&&x.is_last).length;if(work<req||last<lastReq)out.push(`<span class="badge warn">${fmtDate(dk)}：ホール${Math.max(0,req-work)}人不足・LAST${Math.max(0,lastReq-last)}人不足</span>`)}$('shortage').innerHTML=out.length?`<div class="stat">${out.join('')}</div>`:'<span class="badge ok">✓ 現在、人数不足日はありません</span>'}
function moveMonth(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);renderSchedule()}
function moveRequestMonth(n){requestMonth=new Date(requestMonth.getFullYear(),requestMonth.getMonth()+n,1);renderRequests()}
function renderRequests(){if(!me)return;const y=requestMonth.getFullYear(),m=requestMonth.getMonth();$('requestMonthTitle').textContent=`${y}年${m+1}月`;$('staffRequestCard').classList.toggle('hidden',isAdmin);$('adminReviewCard').classList.toggle('hidden',!isAdmin);if(!isAdmin){let html='';for(let d=1;d<=days(y,m);d++){const dk=dateKey(y,m,d),r=requests.find(x=>x.staff_id===me.id&&x.shift_date===dk)||{};html+=`<div class="requestDay"><strong>${d}日</strong><div><div class="requestControls"><button class="${r.status==='work'?'active':''}" onclick="setReq('${dk}','work')">出勤</button><button class="${r.status==='off'?'active':''}" onclick="setReq('${dk}','off')">休み</button></div><div class="times"><select id="st_${d}" ${r.status!=='work'?'disabled':''}>${timeOptions(r.start_time)}</select><select id="en_${d}" ${r.status!=='work'?'disabled':''}>${endOptions(r.end_time,r.is_last)}</select></div><div class="muted">${r.submitted?'提出済み':'未提出'}${r.updated_at?' ・ '+new Date(r.updated_at).toLocaleString('ja-JP'):''}</div></div></div>`}$('requestDays').innerHTML=html;}
if(isAdmin)renderReview();}
function timeOptions(v){let s='<option value="">開始</option>';for(let h=15;h<=23;h++)for(let q=0;q<60;q+=15){let x=`${String(h).padStart(2,'0')}:${String(q).padStart(2,'0')}`;s+=`<option ${v===x?'selected':''} value="${x}">${x}</option>`}for(let h=0;h<=3;h++)for(let q=0;q<60;q+=15){let x=`${String(h).padStart(2,'0')}:${String(q).padStart(2,'0')}`;s+=`<option ${v===x?'selected':''} value="${x}">${x}</option>`}return s}
function endOptions(v,last){return `<option value="">終了</option>${timeOptions(v).replace('<option value="">開始</option>','')}<option value="LAST" ${last?'selected':''}>LAST</option>`}
async function setReq(dk,status){const old=requests.find(x=>x.staff_id===me.id&&x.shift_date===dk);const row={staff_id:me.id,shift_date:dk,status,start_time:old?.start_time||null,end_time:old?.end_time||null,is_last:old?.is_last||false,submitted:false};if(status==='off'){row.start_time=null;row.end_time=null;row.is_last=false}const {error}=await db.from('shift_requests').upsert(row,{onConflict:'staff_id,shift_date'});if(error)alert(error.message);else await loadAll()}
async function submitRequests(){for(let d=1;d<=days(requestMonth.getFullYear(),requestMonth.getMonth());d++){const dk=dateKey(requestMonth.getFullYear(),requestMonth.getMonth(),d),r=requests.find(x=>x.staff_id===me.id&&x.shift_date===dk);if(!r)continue;let start=r.start_time,end=r.end_time,last=r.is_last;if(r.status==='work') {start=$('st_'+d)?.value||start;end=$('en_'+d)?.value||end;last=end==='LAST';if(!start){alert(`${d}日の開始時間を選んでください`);return}if(end==='LAST')end=null; if(!end&&!last){alert(`${d}日の終了時間を選んでください`);return}}else{start=null;end=null;last=false}const {error}=await db.from('shift_requests').update({start_time:start,end_time:end,is_last:last,submitted:true,updated_at:new Date().toISOString()}).eq('id',r.id);if(error){alert(error.message);return}}await loadAll();alert('希望シフトを提出しました😊')}
function setReviewMode(m){reviewMode=m;$('reviewDateBtn').classList.toggle('active',m==='date');$('reviewStaffBtn').classList.toggle('active',m==='staff');renderReview()}
function renderReview(){
 const entries=requests.filter(x=>x.submitted),getStaff=id=>staff.find(s=>s.id===id);
 if(reviewMode==='date'){
  const y=requestMonth.getFullYear(),m=requestMonth.getMonth(),max=days(y,m);
  const available=[];for(let d=1;d<=max;d++){const dk=dateKey(y,m,d);if(requests.some(r=>r.submitted&&r.shift_date===dk)||shifts.some(x=>x.shift_date===dk))available.push(dk)}
  if(!reviewDate||!reviewDate.startsWith(`${y}-${String(m+1).padStart(2,'0')}-`)||!available.includes(reviewDate)) reviewDate=available[0]||dateKey(y,m,1);
  $('reviewDatePicker').innerHTML=`<div class="reviewDateSelect"><label style="white-space:nowrap;font-weight:700">確認する日</label><select onchange="reviewDate=this.value;renderReview()">${Array.from({length:max},(_,i)=>{const dk=dateKey(y,m,i+1);return `<option value="${dk}" ${dk===reviewDate?'selected':''}>${fmtDate(dk)}</option>`}).join('')}</select></div>`;
  const dk=reviewDate,confirmed=shifts.filter(x=>x.shift_date===dk&&x.status!=='off'),offConfirmed=shifts.filter(x=>x.shift_date===dk&&x.status==='off'),pending=requests.filter(r=>r.submitted&&r.shift_date===dk&&!shifts.some(x=>x.staff_id===r.staff_id&&x.shift_date===dk));
  const count=confirmed.length,last=confirmed.filter(x=>x.is_last).length;
  let html=`<div class="reviewHint">この日は「確定済み」と「まだ確定していない希望」を並べて確認できます。</div>`;
  html+=`<div class="reviewSection"><h3>✅ 確定しているシフト <span class="badge">${count}人出勤・LAST ${last}人</span></h3>${confirmed.length?confirmed.sort((a,b)=>(getStaff(a.staff_id)?.name||'').localeCompare(getStaff(b.staff_id)?.name||'')).map(x=>confirmedRow(x,getStaff)).join(''):'<div class="off">まだ確定シフトはありません。</div>'}${offConfirmed.length?`<div class="muted" style="margin-top:8px">休み確定：${offConfirmed.map(x=>esc(getStaff(x.staff_id)?.name||'不明')).join('、')}</div>`:''}</div>`;
  html+=`<div class="reviewSection"><h3>📝 追加・未確定の希望 <span class="badge">${pending.length}件</span></h3>${pending.length?pending.sort((a,b)=>(getStaff(a.staff_id)?.name||'').localeCompare(getStaff(b.staff_id)?.name||'')).map(reviewRow).join(''):'<div class="off">未確定の追加希望はありません。</div>'}</div>`;
  $('requestReview').innerHTML=html;return;
 }
 $('reviewDatePicker').innerHTML='';
 if(!entries.length){$('requestReview').innerHTML='<span class="off">まだ提出された希望はありません。</span>';return}
 let groups={};entries.forEach(r=>{(groups[r.staff_id]??=[]).push(r)});
 $('requestReview').innerHTML=Object.keys(groups).sort((a,b)=>(getStaff(a)?.name||'').localeCompare(getStaff(b)?.name||'')).map(key=>{const arr=groups[key];return `<div class="reviewDate"><div class="reviewHead"><strong>${esc(getStaff(key)?.name||'不明')}</strong><span class="badge">${arr.filter(r=>r.status==='work').length}日出勤希望</span></div>${arr.sort((a,b)=>a.shift_date.localeCompare(b.shift_date)).map(reviewRow).join('')}</div>`}).join('')}
function confirmedRow(x,getStaff){const s=getStaff(x.staff_id);return `<div class="reviewPerson"><div><b>${s?.is_newcomer?'🔰 ':''}${esc(s?.name||'')}</b><div class="muted">${esc(shiftLabel(x))}</div></div><span class="badge ok">確定</span><div class="reviewActions"><button class="btn" onclick="editShift('${x.staff_id}','${x.shift_date}')">確定を変更</button></div></div>`}
function reviewRow(r){const s=staff.find(x=>x.id===r.staff_id);return `<div class="reviewPerson"><div><b>${s?.is_newcomer?'🔰 ':''}${esc(s?.name||'')}</b><div class="muted">${r.status==='off'?'休み':`${timeLabel(r.start_time)}〜${r.is_last?'LAST':timeLabel(r.end_time)}`}</div></div><span class="badge">未確定</span><div class="reviewActions"><button class="btn" style="background:#e8f7ed;color:#17833b" onclick="confirmReq('${r.id}')">この希望で確定</button><button class="btn primary" onclick="openConfirmEdit('${r.id}')">時間を変更して確定</button></div></div>`}
async function confirmReq(id){const r=requests.find(x=>x.id===id);if(!r)return;const row={staff_id:r.staff_id,shift_date:r.shift_date,status:r.status,start_time:r.start_time,end_time:r.end_time,is_last:r.is_last,note:r.note||null,updated_at:new Date().toISOString()};const {error}=await db.from('shifts').upsert(row,{onConflict:'staff_id,shift_date'});if(error)alert(error.message);else await loadAll()}
function openConfirmEdit(id){const r=requests.find(x=>x.id===id);if(!r)return;reviewEditKey={type:'request',id};openShiftModal('希望を変更して確定',r)}
function editShift(staffId,dk){const x=shifts.find(q=>q.staff_id===staffId&&q.shift_date===dk);if(!x)return;reviewEditKey={type:'shift',staffId,dk};openShiftModal('確定シフトを変更',x)}
function openShiftModal(title,x){$('modalTitle').textContent=title;let start=x.start_time||'',end=x.end_time||'';$('modalBody').innerHTML=`<label>勤務状態</label><div class="requestControls"><button id="mWork" class="${x.status!=='off'?'active':''}" onclick="modalStatus('work')">出勤</button><button id="mOff" class="${x.status==='off'?'active':''}" onclick="modalStatus('off')">休み</button></div><label>開始</label><select id="mStart">${timeOptions(start)}</select><label>終了</label><select id="mEnd">${endOptions(end,x.is_last)}</select><div style="margin:10px 0"><label><input id="mLast" type="checkbox" ${x.is_last?'checked':''} style="width:auto"> LAST</label></div><div class="row"><button class="btn primary" onclick="saveModalShift()">保存・確定</button><button class="btn" onclick="closeModal()">キャンセル</button></div>`;$('modal').classList.remove('hidden')}
function modalStatus(v){$('mWork').classList.toggle('active',v==='work');$('mOff').classList.toggle('active',v==='off');$('mStart').disabled=v==='off';$('mEnd').disabled=v==='off';$('mLast').disabled=v==='off'}
async function saveModalShift(){const off=$('mOff').classList.contains('active');let row;if(off)row={status:'off',start_time:null,end_time:null,is_last:false};else{const st=$('mStart').value,en=$('mEnd').value,last=$('mLast').checked||en==='LAST';if(!st){alert('開始時間を選択してください');return}if(!en&&!last){alert('終了時間を選択してください');return}row={status:'work',start_time:st,end_time:last?null:en,is_last:last}}let error;if(reviewEditKey.type==='request'){const r=requests.find(x=>x.id===reviewEditKey.id);({error}=await db.from('shifts').upsert({staff_id:r.staff_id,shift_date:r.shift_date,...row,updated_at:new Date().toISOString()},{onConflict:'staff_id,shift_date'}))}else{({error}=await db.from('shifts').update({...row,updated_at:new Date().toISOString()}).eq('staff_id',reviewEditKey.staffId).eq('shift_date',reviewEditKey.dk))}if(error)alert(error.message);else{closeModal();await loadAll()}}
function closeModal(){$('modal').classList.add('hidden');reviewEditKey=null}
async function toggleClosed(dk){if(!isAdmin)return;const exists=closed.find(x=>x.shift_date===dk);let r;if(exists)r=await db.from('closed_dates').delete().eq('shift_date',dk);else{const note=prompt('この日のメモ（任意）','')??'';r=await db.from('closed_dates').insert({shift_date:dk,note})}if(r.error)alert(r.error.message);else await loadAll()}
function renderStaff(){if(!isAdmin)return;$('staffList').innerHTML=staff.map(s=>`<div class="staffRow"><div class="row"><div style="flex:1"><b>${s.is_newcomer?'🔰 ':''}${esc(s.name)}</b><div class="muted">${s.user_id?'登録済み':'未登録'} ・ ${s.is_newcomer?'新人':'通常'}</div></div>${!s.user_id?`<button class="btn" onclick="showCode('${s.id}')">招待コード</button>`:''}<button class="btn ${s.is_newcomer?'danger':''}" onclick="toggleNewcomer('${s.id}',${!s.is_newcomer})">${s.is_newcomer?'新人解除':'新人にする'}</button></div></div>`).join('')}
async function addStaff(){const name=$('newStaffName').value.trim();if(!name)return;const code=Math.random().toString(36).slice(2,10).toUpperCase();const {error}=await db.from('staff').insert({name,role:'staff',active:true,is_admin:false,is_newcomer:false,invite_code:code});if(error)alert(error.message);else{$('newStaffName').value='';await loadAll();showCodeByName(name,code)}}
function showCode(id){const s=staff.find(x=>x.id===id);if(s)alert(`${s.name}さんの招待コード\n\n${s.invite_code||'未発行'}`)}
function showCodeByName(name,code){alert(`${name}さんの招待コード\n\n${code}\n\nこのコードを本人に渡してください。`)}
async function toggleNewcomer(id,v){const {error}=await db.from('staff').update({is_newcomer:v,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else await loadAll()}
function showTab(id,btn){['schedule','requests','staff'].forEach(x=>$(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.top .tab').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active')}
function showError(t){$('authView').classList.remove('hidden');$('appView').classList.add('hidden');msg('authMsg',t,true)}
async function init(){const s=await db.auth.getSession();if(s.data.session)await loadAll();else{$('authView').classList.remove('hidden');$('appView').classList.add('hidden')}}
setInterval(()=>{if(session)loadAll()},15000);init();
</script>
</body></html>
