<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f5f6f8;color:#222}header{background:#fff;padding:16px;position:sticky;top:0;z-index:3;border-bottom:1px solid #e8e8e8}h1{font-size:21px;margin:0 0 5px}.sub{font-size:12px;color:#777}.tabs{display:flex;gap:7px;margin-top:12px}.tab{border:0;background:#eee;padding:9px 12px;border-radius:20px;font-weight:700}.tab.active{background:#222;color:#fff}main{padding:14px;max-width:900px;margin:auto}.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 10px #0001}.month{display:flex;justify-content:space-between;align-items:center}.month button{border:0;background:#eee;border-radius:10px;padding:8px 14px;font-size:20px}.grid{overflow:auto}.table{min-width:760px;border-collapse:collapse;width:100%}th,td{border:1px solid #e5e5e5;padding:8px;text-align:center;white-space:nowrap}th{background:#fafafa}.name{position:sticky;left:0;background:#fff;text-align:left;font-weight:700}.shift{display:inline-block;border-radius:8px;padding:5px 7px;font-size:12px;background:#eaf4ff}.off{color:#aaa}.badge{font-size:11px;border-radius:12px;padding:4px 8px;background:#eee}.warn{background:#fff0f0;color:#c33}.ok{background:#e8f7ed;color:#17833b}.hidden{display:none!important}.list{display:flex;flex-direction:column;gap:8px}button{cursor:pointer}.primary{background:#222;color:#fff;border:0;border-radius:10px;padding:11px 14px;font-weight:700}.secondary{background:#eee;color:#222;border:0;border-radius:10px;padding:10px 12px;font-weight:700}.danger{color:#d33;border:0;background:none}input,select{padding:11px;border:1px solid #ddd;border-radius:9px;width:100%;margin:5px 0 10px}.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.auth .card{width:min(440px,100%)}.auth button{width:100%;margin-top:4px}.authSwitch{font-size:12px;text-align:center;color:#666;margin-top:12px}.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:10}.sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:20px;max-height:88vh;overflow:auto}.timeRow{display:flex;gap:8px;align-items:center}.timeRow select{flex:1}.quick{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}.quick button{border:0;background:#eee;border-radius:18px;padding:9px 13px}.actions{display:flex;gap:8px}.actions button{flex:1}.memoBox{display:flex;gap:7px;align-items:center;margin-top:10px}.memoBox input{margin:0;flex:1}.memoList{display:flex;flex-direction:column;gap:5px;margin-top:8px}.memoItem{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#fafafa;border-radius:9px;padding:6px 9px;font-size:12px}.memoItem button{border:0;background:none;color:#999}.quick button.active{background:#222;color:#fff}.dateClosedBtn{border:0;background:transparent;font-weight:700;padding:4px 5px;border-radius:8px;min-width:48px}.dateClosedBtn small{display:block;font-size:8px;font-weight:500;color:#888;margin-top:2px}.dateClosedBtn.closed{background:#eee;color:#888}.dateClosedBtn.weekendLike{background:#fff3d8}.requestDay{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;padding:10px;border:1px solid #eee;border-radius:12px}.requestControls{display:grid;grid-template-columns:1fr 1fr;gap:6px}.requestControls button{border:0;background:#eee;border-radius:9px;padding:8px}.requestControls button.active{background:#222;color:#fff}.requestTimes{display:flex;gap:6px}.requestTimes select{margin:4px 0}.customTime{display:none;margin:4px 0 10px}.customTime.show{display:block}.customLabel{font-size:11px;color:#777}.reviewDate{padding:12px;border:1px solid #e7e7e7;border-radius:14px;margin-bottom:10px}.reviewDateHead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.reviewDateTitle{font-weight:800;font-size:17px}.reviewCount{font-size:11px;border-radius:12px;padding:4px 8px;background:#eaf4ff;color:#2879d8}.reviewPerson{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center;padding:9px 0;border-top:1px solid #f0f0f0}.reviewPersonName{font-weight:700}.reviewPersonTime{font-size:13px;text-align:right}.reviewPersonActions{grid-column:1 / -1;display:flex;gap:6px}.reviewPersonActions button{flex:1;border:0;border-radius:8px;padding:8px;font-size:11px;font-weight:700}.reviewConfirm{background:#e8f7ed;color:#17833b}.reviewEdit{background:#222;color:#fff}.reviewLocked{font-size:11px;color:#17833b}.reviewToggle{display:flex;gap:7px;margin-bottom:10px}.reviewToggle button{flex:1;border:0;border-radius:10px;padding:9px;background:#eee;font-weight:700}.reviewToggle button.active{background:#222;color:#fff}.staffRow{display:grid;grid-template-columns:1fr auto auto;gap:7px;align-items:center;padding:10px;border:1px solid #eee;border-radius:10px}.mini{font-size:11px;color:#777}.roleBtn{border:0;border-radius:9px;padding:7px 9px;font-weight:700;background:#eee}.roleBtn.admin{background:#e8f7ed;color:#17833b}.newcomerBtn{border:0;background:#fff0f0;color:#d33;border-radius:9px;padding:7px 10px;font-weight:700}.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.userPill{font-size:11px;background:#eee;padding:6px 9px;border-radius:14px}.notice{padding:10px;border-radius:10px;background:#fff7df;font-size:12px;margin-bottom:10px}.adminOnly{display:none}.isAdmin .adminOnly{display:block}.isAdmin .adminTab{display:inline-block}

<body>
<div id="authView" class="auth"><div class="card"><h1>シフト管理</h1><div class="sub">みんなで共有できるシフト管理</div><div id="authMessage" class="notice hidden"></div><label>メールアドレス</label><input id="authEmail" type="email" autocomplete="email"><label>パスワード</label><input id="authPassword" type="password" autocomplete="current-password"><div id="signupNameBox" class="hidden"><label>名前</label><input id="signupName" placeholder="例：葵"></div><button id="authBtn" class="primary" onclick="submitAuth()">ログイン</button><div class="authSwitch"><button id="authSwitchBtn" class="danger" onclick="toggleAuthMode()">初めての方はこちら</button></div></div></div>
<div id="appView" class="hidden"><header><div class="topbar"><div><h1>シフト管理</h1><div id="roleText" class="sub"></div></div><div><span id="userPill" class="userPill"></span><button class="secondary" onclick="logout()">ログアウト</button></div></div><div class="tabs"><button class="tab active" onclick="showTab('schedule',this)">月間シフト</button><button class="tab" onclick="showTab('requests',this)">希望シフト</button><button id="staffTab" class="tab adminTab hidden" onclick="showTab('staff',this)">スタッフ</button></div></header>
<main id="main" class="">
<section id="schedule"><div class="card month"><button onclick="moveMonth(-1)">‹</button><strong id="title"></strong><button onclick="moveMonth(1)">›</button></div><div class="card"><div style="font-weight:700;font-size:16px;margin-bottom:8px">人数不足日の表示</div><div class="quick"><button id="shortageFirst" onclick="setShortagePeriod('first')">1〜15日</button><button id="shortageSecond" onclick="setShortagePeriod('second')">16日〜月末</button><button id="shortageAll" onclick="setShortagePeriod('all')">1ヶ月</button></div><div id="shortage"></div><div id="shortagePeriodLabel" class="mini"></div><div class="memoBox adminOnly"><input id="memoInput" maxlength="30" placeholder="短いメモ（例：7日 社員休み）"><button class="primary" onclick="addMemo()">メモ追加</button></div><div id="memoList" class="memoList"></div></div><div class="card grid"><table class="table"><thead id="head"></thead><tbody id="body"></tbody></table></div></section>
<section id="requests" class="hidden"><div class="card"><h2>希望シフトを提出</h2><div id="requestHelp" class="mini"></div><div id="requestDays" class="list" style="margin-top:12px"></div><button class="primary" style="width:100%;margin-top:12px" onclick="submitAllRequests()">希望シフトを提出</button></div><div class="card adminOnly"><h2>管理者：提出された希望</h2><div class="mini" style="margin-bottom:10px">日付ごとに確認して、確定または管理者変更できます。</div><div class="reviewToggle"><button id="reviewByDateBtn" class="active" onclick="setReviewMode('date')">📅 日付ごと</button><button id="reviewByStaffBtn" onclick="setReviewMode('staff')">👤 名前ごと</button></div><div id="requestReview"></div></div></section>
<section id="staff" class="hidden adminOnly"><div class="card"><h2>スタッフ管理</h2><div class="mini">新人マーク・社員/バイト・管理者権限を管理します。</div><div id="staffList" class="list" style="margin-top:10px"></div><hr><input id="newStaff" placeholder="スタッフ名"><button class="primary" onclick="addStaff()">スタッフを追加</button></div></section>
</main></div>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="sheet"><h2 id="modalTitle"></h2><label>勤務時間</label><div class="timeRow"><select id="start"></select><span>〜</span><select id="end"></select></div><div class="quick"><button onclick="quickSet('休み')">休み</button><button onclick="quickSet('18:00〜')">18時〜</button><button onclick="quickSet('20:00〜')">20時〜</button><button onclick="quickSet('LAST')">LAST</button></div><div class="actions"><button class="primary" onclick="saveShift()">保存</button><button class="secondary" onclick="closeModal()">キャンセル</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://eroyuafrsntfszvoplrv.supabase.co';
const SUPABASE_KEY='sb_publishable_TJT6cTkWmPHsjMBusx0r0w__x3f77yG';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,currentStaff=null,state={staff:[],shifts:{},requests:{},confirmed:{},closed:{},weekendLike:{},memos:{},newcomers:{},roles:{}};
let viewDate=new Date();viewDate.setDate(1),requestDate=new Date(viewDate);let editing=null,shortagePeriod='first',reviewMode='date',authMode='login';
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function key(s,d){return s+'|'+d}function dk(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function days(y,m){return new Date(y,m+1,0).getDate()}
function fmtDate(k){let [y,m,d]=k.split('-').map(Number),dt=new Date(y,m-1,d);return m+'/'+d+'（'+['日','月','火','水','木','金','土'][dt.getDay()]+'）'}
function timeOptions(last=false){let a=['<option value="">選択</option>'];for(let t=15*60;t<=23*60+45;t+=15){let h=Math.floor(t/60),m=t%60,v=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');a.push(`<option value="${v}">${v}</option>`)}for(let t=0;t<=180;t+=15){let h=Math.floor(t/60),m=t%60,v=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');a.push(`<option value="${v}">${v}</option>`)}if(last)a.push('<option value="LAST">LAST</option>');return a.join('')}
function msg(t){$('authMessage').textContent=t;$('authMessage').classList.remove('hidden')}
function toggleAuthMode(){authMode=authMode==='login'?'signup':'login';$('signupNameBox').classList.toggle('hidden',authMode!=='signup');$('authBtn').textContent=authMode==='login'?'ログイン':'アカウント登録';$('authSwitchBtn').textContent=authMode==='login'?'初めての方はこちら':'ログインはこちら';$('authMessage').classList.add('hidden')}
async function submitAuth(){let email=$('authEmail').value.trim(),pass=$('authPassword').value,name=$('signupName').value.trim();if(!email||!pass){msg('メールアドレスとパスワードを入力してください');return}if(authMode==='signup'){if(!name){msg('名前を入力してください');return}let {data,error}=await sb.auth.signUp({email,password:pass});if(error){msg(error.message);return}if(data.session){await registerStaff(name);return}msg('確認メールを送信しました。メール確認後、もう一度ログインしてください。')}else{let {error}=await sb.auth.signInWithPassword({email,password:pass});if(error)msg(error.message)}}
async function registerStaff(name){let {data,error}=await sb.rpc('register_shift_staff',{p_name:name});if(error){msg(error.message);return}await loadApp()}
async function logout(){await sb.auth.signOut()}
async function boot(){let {data:{user}}=await sb.auth.getUser();if(user){currentUser=user;await loadApp()}sb.auth.onAuthStateChange(async (_e,s)=>{currentUser=s?.user||null;if(currentUser)await loadApp();else showAuth()})}
function showAuth(){$('authView').classList.remove('hidden');$('appView').classList.add('hidden')}
async function loadApp(){let {data:me}=await sb.from('staff').select('*').eq('user_id',currentUser.id).eq('active',true).maybeSingle();if(!me){showAuth();msg('スタッフ登録が見つかりません。アカウント登録から名前を登録してください。');return}currentStaff=me;let {data:staff,error:e1}=await sb.from('staff').select('*').eq('active',true).order('created_at');if(e1){alert(e1.message);return}state.staff=staff||[];state.newcomers={};state.roles={};staff.forEach(s=>{state.newcomers[s.name]=!!s.role?.includes('新人')||false;state.roles[s.name]=s.role||'バイト'});let {data:sh}=await sb.from('shifts').select('*');state.shifts={};state.confirmed={};(sh||[]).forEach(r=>{let v=r.status==='off'?'休み':r.start_time?(r.start_time.slice(0,5)+'〜'+(r.is_last?'LAST':r.end_time?r.end_time.slice(0,5):'')):'';if(v){state.shifts[key((staff.find(x=>x.id===r.staff_id)||{}).name,r.shift_date)]=v;if(r.status==='confirmed')state.confirmed[key((staff.find(x=>x.id===r.staff_id)||{}).name,r.shift_date)]=v}});let {data:req}=await sb.from('shift_requests').select('*');state.requests={};(req||[]).forEach(r=>{let s=staff.find(x=>x.id===r.staff_id);if(s)state.requests[key(s.name,r.shift_date)]={status:r.status,start:r.start_time?.slice(0,5)||'',end:r.is_last?'LAST':r.end_time?.slice(0,5)||'',submitted:true,id:r.id}});let {data:dates}=await sb.from('shop_dates').select('*');state.closed={};state.weekendLike={};(dates||[]).forEach(r=>{state.closed[r.date]=!!r.is_closed;state.weekendLike[r.date]=!!r.weekend_like});let {data:memos}=await sb.from('shift_memos').select('*');state.memos={};(memos||[]).forEach(r=>{let month=r.memo_date.slice(0,7);(state.memos[month]??=[]).push({id:r.id,text:r.text})});$('authView').classList.add('hidden');$('appView').classList.remove('hidden');$('main').classList.toggle('isAdmin',!!currentStaff.is_admin);$('roleText').textContent=currentStaff.is_admin?'管理者モード':'スタッフモード';$('userPill').textContent=currentStaff.name;render();}
async function refresh(){await loadApp()}
function render(){renderSchedule();renderRequestDays();renderRequestReview();renderStaff()}
function renderSchedule(){let y=viewDate.getFullYear(),m=viewDate.getMonth();$('title').textContent=y+'年'+(m+1)+'月';let h='<tr><th>スタッフ</th>';for(let d=1;d<=days(y,m);d++){let k=dk(y,m,d),w=['日','月','火','水','木','金','土'][new Date(y,m,d).getDay()];h+=`<th><button class="dateClosedBtn ${state.closed[k]?'closed':''} ${state.weekendLike[k]?'weekendLike':''}" onclick="${currentStaff.is_admin?`toggleDate(${d})`:'void(0)'}">${d}日(${w})<small>${state.closed[k]?'休業':state.weekendLike[k]?'週末扱い':currentStaff.is_admin?'設定':''}</small></button></th>`}$('head').innerHTML=h+'</tr>';let b='';state.staff.forEach(s=>{b+=`<tr><td class="name">${esc(s.name)}${state.newcomers[s.name]?' 🔰':''}${s.role==='社員'?' <span class="mini">社員</span>':''}</td>`;for(let d=1;d<=days(y,m);d++){let k=dk(y,m,d),v=state.confirmed[key(s.name,k)]||state.shifts[key(s.name,k)]||'';b+=`<td>${state.closed[k]?'<span class="shift">休業</span>':v?`<span class="shift">${esc(v)}</span>`:'<span class="off">—</span>'}</td>`}b+='</tr>'});$('body').innerHTML=b;let bad=[];for(let d=1;d<=days(y,m);d++){let inP=shortagePeriod==='all'||shortagePeriod==='first'&&d<=15||shortagePeriod==='second'&&d>=16;if(!inP)continue;let k=dk(y,m,d);if(state.closed[k])continue;let day=new Date(y,m,d).getDay(),week=day===0||day===5||day===6||state.weekendLike[k],req=week?4:3,lastReq=week?2:1;let workers=state.staff.filter(s=>s.role!=='社員').map(s=>state.shifts[key(s.name,k)]||'').filter(Boolean);let n=workers.filter(v=>v!=='休み').length,last=workers.filter(v=>v==='LAST'||v.endsWith('〜LAST')).length;let x=[];if(n<req)x.push('ホール'+(req-n)+'人不足');if(last<lastReq)x.push('ラスト'+(lastReq-last)+'人不足');if(x.length)bad.push(fmtDate(k)+' '+x[0]+(x[1]?'（'+x[1]+'）':''));}$('shortage').innerHTML=bad.length?'<span class="badge warn">⚠ 人数不足</span> '+bad.join('・'):'<span class="badge ok">✓ 人数OK</span>';$('shortageFirst').classList.toggle('active',shortagePeriod==='first');$('shortageSecond').classList.toggle('active',shortagePeriod==='second');$('shortageAll').classList.toggle('active',shortagePeriod==='all');$('shortagePeriodLabel').textContent=shortagePeriod==='first'?'現在：1〜15日の不足日を表示':shortagePeriod==='second'?'現在：16日〜月末の不足日を表示':'現在：1ヶ月分の不足日を表示';renderMemos()}
function renderMemos(){let a=state.memos[viewDate.getFullYear()+'-'+String(viewDate.getMonth()+1).padStart(2,'0')]||[];$('memoList').innerHTML=a.map(x=>`<div class="memoItem"><span>📝 ${esc(x.text)}</span>${currentStaff.is_admin?`<button onclick="deleteMemo('${x.id}')">削除</button>`:''}</div>`).join('')}
async function addMemo(){let t=$('memoInput').value.trim();if(!t)return;let d=dk(viewDate.getFullYear(),viewDate.getMonth(),1);let {error}=await sb.from('shift_memos').insert({memo_date:d,text:t});if(error)alert(error.message);else{$('memoInput').value='';await refresh()}}
async function deleteMemo(id){await sb.from('shift_memos').delete().eq('id',id);await refresh()}
async function toggleDate(d){let k=dk(viewDate.getFullYear(),viewDate.getMonth(),d),closed=!state.closed[k];let {error}=await sb.from('shop_dates').upsert({date:k,is_closed:closed,weekend_like:state.weekendLike[k]||false},{onConflict:'date'});if(error)alert(error.message);else await refresh()}
function setShortagePeriod(p){shortagePeriod=p;renderSchedule()}
function moveMonth(n){viewDate.setMonth(viewDate.getMonth()+n);renderSchedule();renderRequestReview()}
function showTab(id,btn){['schedule','requests','staff'].forEach(x=>$(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(id==='requests'){renderRequestDays();renderRequestReview()}}
function renderRequestDays(){let y=requestDate.getFullYear(),m=requestDate.getMonth(),html='';$('requestHelp').textContent=currentStaff.role==='社員'?'社員は出勤・休みだけを登録します。':'希望時間を入力してください。15:00〜3:00が基本で、任意時間も入力できます。';for(let d=1;d<=days(y,m);d++){let k=dk(y,m,d),r=state.requests[key(currentStaff.name,k)]||{status:'',start:'',end:''},confirmed=state.confirmed[key(currentStaff.name,k)];html+=`<div class="requestDay"><strong>${d}日</strong><div><div class="requestControls"><button class="${r.status==='work'?'active':''}" onclick="setRequest('${k}','work')">出勤</button><button class="${r.status==='off'?'active':''}" onclick="setRequest('${k}','off')">休み</button></div>${currentStaff.role==='社員'?'':`<div class="requestTimes"><select id="rs_${d}" onchange="requestTime('${k}','start',this.value)" ${r.status!=='work'||confirmed?'disabled':''}>${timeOptions()}</select><select id="re_${d}" onchange="requestTime('${k}','end',this.value)" ${r.status!=='work'||confirmed?'disabled':''}>${timeOptions(true)}</select></div>`}${confirmed?'<div class="mini">🔒 確定済み</div>':''}</div></div>`}$('requestDays').innerHTML=html;for(let d=1;d<=days(y,m);d++){let k=dk(y,m,d),r=state.requests[key(currentStaff.name,k)]||{};if(currentStaff.role!=='社員'){let a=$('rs_'+d),b=$('re_'+d);if(a)a.value=r.start||'';if(b)b.value=r.end||''}}}
async function setRequest(k,status){let existing=state.requests[key(currentStaff.name,k)]||{};if(state.confirmed[key(currentStaff.name,k)]){alert('確定済みのシフトは変更できません');return}let payload={staff_id:currentStaff.id,shift_date:k,status,start_time:null,end_time:null,is_last:false,note:null};if(status==='work'){payload.start_time=existing.start||null;payload.end_time=existing.end==='LAST'?null:existing.end||null;payload.is_last=existing.end==='LAST'}let {error}=await sb.from('shift_requests').upsert(payload,{onConflict:'staff_id,shift_date'});if(error)alert(error.message);else await refresh()}
async function requestTime(k,type,v){if(v==='')return;let r=state.requests[key(currentStaff.name,k)]||{};r[type]=v;let {error}=await sb.from('shift_requests').update({start_time:r.start||null,end_time:r.end&&r.end!=='LAST'?r.end:null,is_last:r.end==='LAST'}).eq('id',r.id);if(error)alert(error.message);else await refresh()}
async function submitAllRequests(){let {data,error}=await sb.from('shift_requests').select('*').eq('staff_id',currentStaff.id).eq('shift_date','gte.'+requestDate.toISOString().slice(0,10));if(error){alert(error.message);return}alert('入力内容は自動保存されています😊')}
function setReviewMode(m){reviewMode=m;$('reviewByDateBtn').classList.toggle('active',m==='date');$('reviewByStaffBtn').classList.toggle('active',m==='staff');renderRequestReview()}
function reviewHtml(s,k,r){let label=r.status==='off'?'休み':r.start+'〜'+(r.end||'');let c=state.confirmed[key(s,k)];return `<div class="reviewPerson"><div><div class="reviewPersonName">${state.newcomers[s]?'🔰 ':''}${esc(s)}</div>${c?`<div class="reviewLocked">🔒 確定：${esc(c)}</div>`:''}</div><div class="reviewPersonTime">${esc(label)}</div>${c?`<div class="reviewPersonActions"><button class="reviewEdit" onclick="adminEdit('${s}','${k}')">管理者が変更</button></div>`:`<div class="reviewPersonActions"><button class="reviewConfirm" onclick="confirmRequest('${s}','${k}')">この希望で確定</button><button class="reviewEdit" onclick="editAndConfirm('${s}','${k}')">時間を変更して確定</button></div>`}</div>`}
function renderRequestReview(){if(!currentStaff?.is_admin)return;let entries=Object.entries(state.requests).filter(([k,r])=>r.submitted).map(([k,r])=>{let [s,d]=k.split('|');return{s,d,r}}).sort((a,b)=>a.d.localeCompare(b.d)||a.s.localeCompare(b.s));if(!entries.length){$('requestReview').innerHTML='<span class="off">まだ提出された希望はありません。</span>';return}let by={};entries.forEach(x=>(by[x.d]??=[]).push(x));if(reviewMode==='staff'){let bs={};entries.forEach(x=>(bs[x.s]??=[]).push(x));$('requestReview').innerHTML=Object.keys(bs).sort().map(s=>`<div class="reviewDate"><div class="reviewDateHead"><span class="reviewDateTitle">${state.newcomers[s]?'🔰 ':''}${esc(s)}</span><span class="reviewCount">${bs[s].length}日</span></div>${bs[s].map(x=>reviewHtml(s,x.d,x.r)).join('')}</div>`).join('')}else{$('requestReview').innerHTML=Object.keys(by).sort().map(d=>{let a=by[d],w=a.filter(x=>x.r.status==='work').length,l=a.filter(x=>x.r.status==='work'&&x.r.end==='LAST').length;return `<div class="reviewDate"><div class="reviewDateHead"><span class="reviewDateTitle">${fmtDate(d)}</span><span class="reviewCount">${w}人出勤 ・ LAST ${l}人</span></div>${a.map(x=>reviewHtml(x.s,d,x.r)).join('')}</div>`}).join('')}}
async function confirmRequest(s,k){if(!currentStaff.is_admin)return;let r=state.requests[key(s,k)],st=state.staff.find(x=>x.name===s);if(!r||!st)return;let {error}=await sb.from('shifts').upsert({staff_id:st.id,shift_date:k,status:r.status==='off'?'off':'confirmed',start_time:r.start||null,end_time:r.end&&r.end!=='LAST'?r.end:null,is_last:r.end==='LAST',note:r.note||null},{onConflict:'staff_id,shift_date'});if(error)alert(error.message);else await refresh()}
function editAndConfirm(s,k){let r=state.requests[key(s,k)];if(!r)return;if(r.status==='off'){confirmRequest(s,k);return}let st=prompt('確定する開始時間',r.start||'');if(st===null)return;let en=prompt('確定する終了時間（LAST可）',r.end||'');if(en===null)return;adminSave(s,k,st,en)}
function adminEdit(s,k){let c=state.confirmed[key(s,k)]||state.shifts[key(s,k)]||'';let m=c.match(/^(\d{2}:\d{2})〜(.*)$/);if(c==='休み'){confirmRequest(s,k);return}let st=prompt('管理者変更：開始時間',m?.[1]||'');if(st===null)return;let en=prompt('管理者変更：終了時間（LAST可）',m?.[2]||'');if(en===null)return;adminSave(s,k,st,en)}
async function adminSave(s,k,st,en){let staff=state.staff.find(x=>x.name===s);let {error}=await sb.from('shifts').upsert({staff_id:staff.id,shift_date:k,status:'confirmed',start_time:st,end_time:en==='LAST'?null:en,is_last:en==='LAST'},{onConflict:'staff_id,shift_date'});if(error)alert(error.message);else await refresh()}
function renderStaff(){if(!currentStaff?.is_admin)return;$('staffList').innerHTML=state.staff.map(s=>`<div class="staffRow"><div><b>${state.newcomers[s.name]?'🔰 ':''}${esc(s.name)}</b><div class="mini">${s.role||'バイト'} ${s.is_admin?'・管理者':''}</div></div><button class="newcomerBtn" onclick="toggleNewcomer('${s.id}',${!state.newcomers[s.name]})">${state.newcomers[s.name]?'新人解除':'新人にする'}</button><button class="roleBtn ${s.role==='社員'?'admin':''}" onclick="toggleRole('${s.id}','${s.role==='社員'?'バイト':'社員'}')">${s.role==='社員'?'社員→バイト':'バイト→社員'}</button></div>`).join('')}
async function toggleNewcomer(id,v){await sb.from('staff').update({role:v?'新人':'バイト'}).eq('id',id);await refresh()}
async function toggleRole(id,role){await sb.from('staff').update({role}).eq('id',id);await refresh()}
async function addStaff(){let n=$('newStaff').value.trim();if(!n)return;let {error}=await sb.from('staff').insert({name:n,role:'バイト',active:true});if(error)alert(error.message);else{$('newStaff').value='';await refresh()}}
function initTimes(){$('start').innerHTML=timeOptions();$('end').innerHTML=timeOptions(true)}
function openEdit(){/* monthly schedule is intentionally read-only */}
function quickSet(v){if(!editing)return}
function saveShift(){closeModal()}
function closeModal(){$('modal').classList.add('hidden');editing=null}
initTimes();boot();
</script></body></html>
