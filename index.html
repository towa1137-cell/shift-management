<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>シフト管理</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f5f6f8;color:#222}header{background:#fff;padding:18px 16px 12px;position:sticky;top:0;z-index:3;border-bottom:1px solid #e8e8e8}h1{font-size:22px;margin:0 0 12px}.tabs{display:flex;gap:8px}.tab{border:0;background:#eee;padding:9px 14px;border-radius:20px;font-weight:700}.tab.active{background:#222;color:#fff}main{padding:14px}.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 10px #0001}.month{display:flex;justify-content:space-between;align-items:center}.month button{border:0;background:#eee;border-radius:10px;padding:8px 14px;font-size:20px}.grid{overflow:auto}.table{min-width:760px;border-collapse:collapse;width:100%}th,td{border:1px solid #e5e5e5;padding:8px;text-align:center;white-space:nowrap}th{background:#fafafa}.name{position:sticky;left:0;background:#fff;text-align:left;font-weight:700}.name.newcomer{color:#d33}.personName.newcomer{color:#d33;font-weight:700}.newcomerBtn{border:0;background:#fff0f0;color:#d33;border-radius:9px;padding:7px 10px;font-weight:700}.shift{display:inline-block;border-radius:8px;padding:5px 7px;font-size:12px;background:#eaf4ff}.off{color:#aaa}.badge{font-size:11px;border-radius:12px;padding:4px 8px;background:#eee}.ok{background:#e8f7ed;color:#17833b}.warn{background:#fff0f0;color:#c33}.hidden{display:none!important}.list{display:flex;flex-direction:column;gap:8px}.person{display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid #eee;border-radius:10px}button{cursor:pointer}.primary{background:#222;color:#fff;border:0;border-radius:10px;padding:11px 14px;font-weight:700}.danger{color:#d33;border:0;background:none}input,select{padding:11px;border:1px solid #ddd;border-radius:9px;width:100%;margin:5px 0 10px}.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:10}.sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:20px;max-height:82vh;overflow:auto}.timeRow{display:flex;gap:8px;align-items:center}.timeRow select{flex:1}.quick{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}.quick button{border:0;background:#eee;border-radius:18px;padding:9px 13px}.actions{display:flex;gap:8px}.actions button{flex:1}.memoBox{display:flex;gap:7px;align-items:center;margin-top:10px}.memoBox input{margin:0;flex:1}.memoList{display:flex;flex-direction:column;gap:5px;margin-top:8px}.memoItem{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#fafafa;border-radius:9px;padding:6px 9px;font-size:12px}.memoItem button{border:0;background:none;color:#999}.quick button.active{background:#222;color:#fff}.dateClosedBtn{border:0;background:transparent;font-weight:700;padding:4px 5px;border-radius:8px;min-width:42px}.dateClosedBtn small{display:block;font-size:8px;font-weight:500;color:#888;margin-top:2px}.dateClosedBtn.closed{background:#eee;color:#888}.customTime{display:none;margin:4px 0 10px}.customTime.show{display:block}.customLabel{font-size:11px;color:#777;display:block;margin-top:-3px}
.requestDay{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;padding:10px;border:1px solid #eee;border-radius:12px}.requestControls{display:grid;grid-template-columns:1fr 1fr;gap:6px}.requestControls button{border:0;background:#eee;border-radius:9px;padding:8px}.requestControls button.active{background:#222;color:#fff}.requestTimes{display:flex;gap:6px}.requestTimes select{margin:4px 0}.reviewItem{padding:12px;border:1px solid #eee;border-radius:12px;margin-bottom:8px}.reviewActions{display:flex;gap:6px;margin-top:8px}.reviewActions button{flex:1;border:0;border-radius:9px;padding:9px}.confirm{background:#e8f7ed;color:#17833b}.editConfirm{background:#222;color:#fff}</style>
</head>
<body>
<header><h1>シフト管理</h1><div class="tabs"><button class="tab active" onclick="showTab('schedule',this)">月間シフト</button><button class="tab" onclick="showTab('requests',this)">希望シフト</button><button class="tab" onclick="showTab('staff',this)">スタッフ</button></div></header>
<main>
<section id="schedule"><div class="card month"><button onclick="moveMonth(-1)">‹</button><strong id="title"></strong><button onclick="moveMonth(1)">›</button></div><div class="card"><div style="font-weight:700;font-size:16px;margin-bottom:8px">人数不足日の表示</div><div style="font-size:12px;color:#777;margin-bottom:8px">表示する期間を選べます（通常は前半・後半で確認）</div><div class="quick" style="margin-bottom:8px">
<button id="shortageFirst" onclick="setShortagePeriod('first')">1〜15日</button>
<button id="shortageSecond" onclick="setShortagePeriod('second')">16日〜月末</button>
<button id="shortageAll" onclick="setShortagePeriod('all')">1ヶ月</button>
</div><div id="shortage"></div><div id="shortagePeriodLabel" style="font-size:12px;color:#777;margin-top:8px"></div><div class="memoBox"><input id="memoInput" maxlength="30" placeholder="短いメモ（例：7日 社員休み）"><button class="primary" onclick="addMemo()">メモ追加</button></div><div id="memoList" class="memoList"></div></div><div class="card grid"><table class="table"><thead id="head"></thead><tbody id="body"></tbody></table></div></section>
<section id="requests" class="hidden">
<div class="card">
<h2>希望シフトを提出</h2>
<label>スタッフ名</label><select id="requestStaff"></select>
<div class="month"><button onclick="moveRequestMonth(-1)">‹</button><strong id="requestTitle"></strong><button onclick="moveRequestMonth(1)">›</button></div>
<div id="requestDays" class="list" style="margin-top:12px"></div>
<button class="primary" style="width:100%;margin-top:12px" onclick="submitAllRequests()">希望シフトを提出</button>
</div>
<div class="card"><h2>店長：提出された希望</h2><div id="requestReview"></div></div>
</section>
<section id="staff" class="hidden"><div class="card"><h2>スタッフ一覧</h2><div id="staffList" class="list"></div><hr><input id="newStaff" placeholder="スタッフ名"><button class="primary" onclick="addStaff()">スタッフを追加</button></div></section>
</main>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="sheet"><h2 id="modalTitle"></h2><label>勤務時間</label><div class="timeRow"><select id="start"></select><span>〜</span><select id="end"></select></div><div class="quick"><button onclick="quickSet('休み')">休み</button><button onclick="quickSet('18:00〜')">18時〜</button><button onclick="quickSet('20:00〜')">20時〜</button><button onclick="quickSet('LAST')">LAST</button></div><div class="actions"><button class="primary" onclick="saveShift()">保存</button><button onclick="closeModal()">キャンセル</button></div></div></div>
<script>
const KEY='shift_management_v2';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{staff:['葵','太郎','花子','健','美咲'],shifts:{},req:{},closed:{}}; state.closed=state.closed||{}; state.requests=state.requests||{}; state.confirmed=state.confirmed||{}; state.memos=state.memos||{}; state.newcomers=state.newcomers||{};
let viewDate=new Date();viewDate.setDate(1);let editing=null;let shortagePeriod='first';
const $=id=>document.getElementById(id);
function persist(){localStorage.setItem(KEY,JSON.stringify(state))}
function daysInMonth(){return new Date(viewDate.getFullYear(),viewDate.getMonth()+1,0).getDate()}
function dateKey(d){return viewDate.getFullYear()+'-'+String(viewDate.getMonth()+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')}
function timeOptions(){let a=['<option value="">選択</option>'];for(let h=0;h<=29;h++)for(let m=0;m<60;m+=15){let total=h*60+m,hh=String(Math.floor(total/60)%24).padStart(2,'0'),mm=String(total%60).padStart(2,'0');a.push(`<option value="${hh}:${mm}">${hh}:${mm}</option>`)}return a.join('')}
function requestTimeOptions(includeLast=false){let a=['<option value="">選択</option>'];for(let total=15*60;total<=23*60+45;total+=15){let h=Math.floor(total/60),m=total%60;a.push(`<option value="${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}">${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}</option>`)}for(let total=0;total<=3*60;total+=15){let h=Math.floor(total/60),m=total%60;a.push(`<option value="${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}">${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}</option>`)}a.push('<option value="__custom">任意入力</option>');if(includeLast)a.push('<option value="LAST">LAST</option>');return a.join('')}
function initTimes(){$('start').innerHTML=timeOptions();$('end').innerHTML=timeOptions()+'<option value="LAST">LAST</option>'}
function render(){
 $('title').textContent=viewDate.getFullYear()+'年'+(viewDate.getMonth()+1)+'月';
 let h='<tr><th>スタッフ</th>';const wd=['日','月','火','水','木','金','土'];for(let d=1;d<=daysInMonth();d++){let dk=dateKey(d),w=wd[new Date(viewDate.getFullYear(),viewDate.getMonth(),d).getDay()];h+=`<th><button class="dateClosedBtn ${state.closed[dk]?'closed':''}" onclick="toggleClosedDate(${d})">${d}日(${w})<small>${state.closed[dk]?'休業':'休業日にする'}</small></button></th>`}$('head').innerHTML=h+'</tr>';
 let b='';state.staff.forEach((s)=>{b+=`<tr><td class="name">${escapeHtml(s)}${state.newcomers[s]?' 🔰':''}</td>`;for(let d=1;d<=daysInMonth();d++){let dk=dateKey(d),k=s+'|'+dk,v=state.confirmed[k]||state.shifts[k]||'';b+=`<td>${state.closed[dk]?'<span class="shift">休業</span>':(v?`<span class="shift">${escapeHtml(v)}</span>`:'<span class="off">—</span>')}</td>`}b+='</tr>'});$('body').innerHTML=b;
 let bad=[];for(let d=1;d<=daysInMonth();d++){let inPeriod=shortagePeriod==='all'||(shortagePeriod==='first'&&d<=15)||(shortagePeriod==='second'&&d>=16);if(!inPeriod)continue;let dk=dateKey(d);if(state.closed[dk])continue;let date=new Date(viewDate.getFullYear(),viewDate.getMonth(),d);let day=date.getDay();let required=day===0||day===5||day===6?4:3;let lastRequired=day===0||day===5||day===6?2:1;let workers=state.staff.map(s=>state.shifts[s+'|'+dk]||'').filter(v=>v&&v!=='休み');let n=workers.length;let last=workers.filter(v=>v.endsWith('〜LAST')||v==='LAST').length;let shortage=[];if(n<required)shortage.push('ホール'+(required-n)+'人不足');if(last<lastRequired)shortage.push('ラスト'+(lastRequired-last)+'人不足');if(shortage.length){let w=['日','月','火','水','木','金','土'][date.getDay()];bad.push(d+'日('+w+') '+shortage[0]+(shortage.length>1?'（'+shortage[1]+'）':''));}}$('shortage').innerHTML=bad.length?'<span class="badge warn">⚠ 人数不足</span> '+bad.join('・'):'';
$('shortageFirst').classList.toggle('active',shortagePeriod==='first');$('shortageSecond').classList.toggle('active',shortagePeriod==='second');$('shortageAll').classList.toggle('active',shortagePeriod==='all');
 if($('shortagePeriodLabel')) $('shortagePeriodLabel').textContent={first:'現在：1〜15日の不足日を表示',second:'現在：16日〜月末の不足日を表示',all:'現在：1ヶ月分の不足日を表示'}[shortagePeriod]||'';
 renderMemos();
 $('staffList').innerHTML=state.staff.map((s,i)=>`<div class="person"><span class="personName ${state.newcomers[s]?'newcomer':''}">${escapeHtml(s)}${state.newcomers[s]?' 🔰':''}</span><div><button class="newcomerBtn" onclick="toggleNewcomer(${i})">${state.newcomers[s]?'新人解除':'新人にする'}</button><button class="danger" onclick="removeStaff(${i})">削除</button></div></div>`).join('');
 renderRequestUI();
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function js(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function openEdit(si,d){let s=state.staff[si],k=s+'|'+dateKey(d),v=state.shifts[k]||'';editing={k,quick:null,confirmedEdit:false};$('modalTitle').textContent=s+'｜'+dateKey(d)+(state.closed[dateKey(d)]?'（休業日）':'');$('start').value='';$('end').value='';if(v==='休み'){editing.quick='休み'}else if(v==='LAST'){$('end').value='LAST'}else{let m=v.match(/^(\d{2}:\d{2})〜(.*)$/);if(m){$('start').value=m[1];$('end').value=m[2]||''}}$('modal').classList.remove('hidden')}
function openConfirmedEdit(key){let r=state.requests[key]||{},v=state.confirmed[key]||state.shifts[key]||'';editing={k:key,quick:null,confirmedEdit:true};$('modalTitle').textContent=key.split('|')[0]+'｜'+key.split('|')[1]+'（店長変更）';$('start').value='';$('end').value='';if(v==='休み'){editing.quick='休み'}else if(v==='LAST'){$('end').value='LAST'}else{let m=v.match(/^(\d{2}:\d{2})〜(.*)$/);if(m){$('start').value=m[1];$('end').value=m[2]||''}}$('modal').classList.remove('hidden')}
function quickSet(v){editing.quick=v;if(v==='休み'){$('start').value='';$('end').value=''}else if(v==='LAST'){$('start').value='';$('end').value='LAST'}else{$('start').value=v.replace('〜','');$('end').value=''}}
function saveShift(){if(!editing)return;let value;if(editing.quick==='休み')value='休み';else if($('end').value==='LAST'&&$('start').value)value=$('start').value+'〜LAST';else if($('start').value&&$('end').value)value=$('start').value+'〜'+$('end').value;else if($('start').value)value=$('start').value+'〜';else{alert('勤務時間を選択してください');return}state.shifts[editing.k]=value;if(editing.confirmedEdit)state.confirmed[editing.k]=value;persist();closeModal();render()}
function toggleClosed(){if(!editing)return;let dk=editing.k.split('|')[1];if(state.closed[dk]){delete state.closed[dk]}else{state.closed[dk]=true;state.staff.forEach(s=>delete state.shifts[s+'|'+dk])}persist();closeModal();render()}
function closeModal(){$('modal').classList.add('hidden');editing=null}
function moveMonth(n){viewDate.setMonth(viewDate.getMonth()+n);render()}
function addStaff(){let x=$('newStaff').value.trim();if(!x)return;if(!state.staff.includes(x))state.staff.push(x);$('newStaff').value='';persist();render()}
function toggleNewcomer(i){let s=state.staff[i];if(state.newcomers[s])delete state.newcomers[s];else state.newcomers[s]=true;persist();render()}
function removeStaff(i){if(confirm(state.staff[i]+'さんを削除しますか？')){state.staff.splice(i,1);persist();render()}}
let requestDate=new Date(viewDate);requestDate.setDate(1);
function renderRequestUI(){
 $('requestStaff').innerHTML=state.staff.map((s,i)=>`<option value="${i}">${state.newcomers[s]?'🔰 ':''}${escapeHtml(s)}</option>`).join('');
 $('requestStaff').onchange=renderRequestDays;
 renderRequestDays();
 renderRequestReview();
}
function moveRequestMonth(n){requestDate.setMonth(requestDate.getMonth()+n);renderRequestDays()}
function renderRequestDays(){
 if(!$('requestDays'))return;
 let y=requestDate.getFullYear(),m=requestDate.getMonth(),days=new Date(y,m+1,0).getDate();
 $('requestTitle').textContent=y+'年'+(m+1)+'月';
 let si=Number($('requestStaff').value||0),s=state.staff[si]||'';
 let html='';
 for(let d=1;d<=days;d++){
   let dk=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
   let r=state.requests[s+'|'+dk]||{status:'',start:'',end:''};
   html+=`<div class="requestDay"><strong>${d}日</strong><div><div class="requestControls"><button class="${r.status==='work'?'active':''}" onclick="setRequest('${js(dk)}','work')">出勤</button><button class="${r.status==='off'?'active':''}" onclick="setRequest('${js(dk)}','off')">休み</button></div><div class="requestTimes"><select id="rs_${d}" onchange="requestSelectChanged('${js(dk)}','start',this.value)" ${r.status!=='work'?'disabled':''}>${requestTimeOptions()}</select><select id="re_${d}" onchange="requestSelectChanged('${js(dk)}','end',this.value)" ${r.status!=='work'?'disabled':''}>${requestTimeOptions(true)}</select></div><div id="rcs_${d}" class="customTime"><span class="customLabel">任意の開始時間</span><input id="rc_${d}" type="time" onchange="saveRequestTime('${js(dk)}','start',this.value)" ${r.status!=='work'?'disabled':''}></div><div id="rce_${d}" class="customTime"><span class="customLabel">任意の終了時間</span><input id="rce_${d}" type="time" onchange="saveRequestTime('${js(dk)}','end',this.value)" ${r.status!=='work'?'disabled':''}></div></div></div>`;
 }
 $('requestDays').innerHTML=html;
 for(let d=1;d<=days;d++){let dk=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),r=state.requests[s+'|'+dk]||{};let a=$('rs_'+d),b=$('re_'+d),cs=$('rcs_'+d),ce=$('rce_'+d),ci=$('rc_'+d),cei=$('rce_'+d);if(a){let sv=r.start||'',ev=r.end||'';if(sv && !a.querySelector(`option[value="${sv}"]`))a.value='__custom';else a.value=sv;if(ev==='LAST')b.value='LAST';else if(ev && !b.querySelector(`option[value="${ev}"]`))b.value='__custom';else b.value=ev;if(cs)cs.classList.toggle('show',a.value==='__custom');if(ce)ce.classList.toggle('show',b.value==='__custom');if(ci)ci.value=a.value==='__custom'?sv:'';if(cei)cei.value=b.value==='__custom'?ev:''}}
}
function requestSelectChanged(dk,type,value){
 let si=Number($('requestStaff').value||0),s=state.staff[si]||'',d=Number(dk.slice(-2)),customBox=$(type==='start'?'rcs_'+d:'rce_'+d),customInput=$(type==='start'?'rc_'+d:'rce_'+d);
 if(value==='__custom'){customBox.classList.add('show');customInput.disabled=false;return}
 customBox.classList.remove('show');customInput.disabled=true;saveRequestTime(dk,type,value);
}
function saveRequestTime(dk,type,value){
 let si=Number($('requestStaff').value||0),s=state.staff[si]||'',key=s+'|'+dk;
 state.requests[key]=state.requests[key]||{status:'work',start:'',end:''};
 state.requests[key][type]=value;
 persist();
}
function toggleClosedDate(d){
 let dk=dateKey(d);
 if(state.closed[dk]){delete state.closed[dk]}
 else{state.closed[dk]=true;state.staff.forEach(s=>{delete state.shifts[s+'|'+dk];delete state.confirmed[s+'|'+dk]})}
 persist();render();
}
function setRequest(dk,status){
 let si=Number($('requestStaff').value||0),s=state.staff[si]||'',key=s+'|'+dk;
 state.requests[key]=state.requests[key]||{};
 state.requests[key].status=status;
 if(status==='off'){state.requests[key].start='';state.requests[key].end=''}
 persist();
 renderRequestDays();
}
function submitAllRequests(){
 let si=Number($('requestStaff').value||0),s=state.staff[si]||'',y=requestDate.getFullYear(),m=requestDate.getMonth(),days=new Date(y,m+1,0).getDate(),count=0;
 for(let d=1;d<=days;d++){
  let dk=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),key=s+'|'+dk,r=state.requests[key];
  if(!r)continue;
  if(r.status==='work'){let rs=$('rs_'+d).value,re=$('re_'+d).value;r.start=rs==='__custom'?$('rc_'+d).value:rs;r.end=re==='__custom'?$('rce_'+d).value:re;if(r.start)count++}
  if(r.status==='off')count++;
  r.submitted=true;
 }
 persist();renderRequestDays();renderRequestReview();alert(s+'さんの希望シフトを提出しました😊（'+count+'日）');
}
function renderRequestReview(){
 if(!$('requestReview'))return;
 let items=[];
 Object.keys(state.requests).forEach(key=>{
  let r=state.requests[key];if(!r.submitted)return;
  let [s,dk]=key.split('|');let label=r.status==='off'?'休み':(r.start||'')+'〜'+(r.end||'');
  let confirmed=state.confirmed[key];
  items.push(`<div class="reviewItem"><strong class="${state.newcomers[s]?'personName newcomer':''}">${state.newcomers[s]?'🔰 ':''}${escapeHtml(s)}</strong>　${dk}<br><span>${escapeHtml(label)}</span>${confirmed?`<br>🔒 確定：${escapeHtml(confirmed)}<div class="reviewActions"><button class="editConfirm" onclick="openConfirmedEdit('${js(key)}')">店長が変更</button></div>`:`<div class="reviewActions"><button class="confirm" onclick="confirmRequest('${js(key)}')">この希望で確定</button><button class="editConfirm" onclick="editAndConfirm('${js(key)}')">時間を変更して確定</button></div>`}</div>`);
 });
 $('requestReview').innerHTML=items.length?items.join(''):'<span class="off">まだ提出された希望はありません。</span>';
}
function confirmRequest(key){
 let r=state.requests[key],value=r.status==='off'?'休み':(r.start||'')+'〜'+(r.end||'');
 state.confirmed[key]=value;
 if(value==='休み') delete state.shifts[key]; else state.shifts[key]=value;
 persist(); render(); renderRequestReview(); alert('確定しました😊');
}
function editAndConfirm(key){
 let r=state.requests[key];if(r.status==='off'){confirmRequest(key);return}
 let start=prompt('確定する開始時間',r.start||'');if(start===null)return;
 let end=prompt('確定する終了時間（LASTも可）',r.end||'');if(end===null)return;
 if(!start||!end){alert('時間を入力してください');return}
 state.confirmed[key]=start+'〜'+end;state.shifts[key]=start+'〜'+end;persist();render();renderRequestReview();alert('変更して確定しました😊');
}
function submitRequest(s){$('requestStaff').value=state.staff.indexOf(s);renderRequestDays()}
function setShortagePeriod(p){
  shortagePeriod=p;
  const label={first:'現在：1〜15日の不足日を表示',second:'現在：16日〜月末の不足日を表示',all:'現在：1ヶ月分の不足日を表示'}[p]||'';
  if($('shortagePeriodLabel')) $('shortagePeriodLabel').textContent=label;
  render();
}
function renderMemos(){
 let month=viewDate.getFullYear()+'-'+String(viewDate.getMonth()+1).padStart(2,'0');
 let arr=state.memos[month]||[];
 $('memoList').innerHTML=arr.map((x,i)=>`<div class="memoItem"><span>📝 ${escapeHtml(x)}</span><button onclick="deleteMemo(${i})">削除</button></div>`).join('');
}
function addMemo(){
 let v=$('memoInput').value.trim();if(!v)return;
 let month=viewDate.getFullYear()+'-'+String(viewDate.getMonth()+1).padStart(2,'0');
 state.memos[month]=state.memos[month]||[];state.memos[month].push(v);
 $('memoInput').value='';persist();renderMemos();
}
function deleteMemo(i){
 let month=viewDate.getFullYear()+'-'+String(viewDate.getMonth()+1).padStart(2,'0');
 if(!state.memos[month])return;state.memos[month].splice(i,1);persist();renderMemos();
}
function showTab(id,btn){['schedule','requests','staff'].forEach(x=>$(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
initTimes();render();
</script>
