<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>シフト管理</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;background:#f5f6f8;color:#222}header{background:#fff;padding:18px 16px 12px;position:sticky;top:0;z-index:3;border-bottom:1px solid #e8e8e8}h1{font-size:22px;margin:0 0 12px}.tabs{display:flex;gap:8px}.tab{border:0;background:#eee;padding:9px 14px;border-radius:20px;font-weight:700}.tab.active{background:#222;color:#fff}main{padding:14px}.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 10px #0000000a}.month{display:flex;justify-content:space-between;align-items:center}.month button{border:0;background:#eee;border-radius:10px;padding:8px 12px;font-size:18px}.grid{overflow:auto}.table{min-width:760px;border-collapse:collapse;width:100%}th,td{border:1px solid #e5e5e5;padding:8px;text-align:center;white-space:nowrap}th{background:#fafafa}.name{position:sticky;left:0;background:#fff;text-align:left;font-weight:700}.shift{display:inline-block;border-radius:8px;padding:5px 7px;font-size:12px;background:#eaf4ff}.off{color:#aaa}.badge{font-size:11px;border-radius:12px;padding:3px 7px;background:#eee}.ok{background:#e8f7ed;color:#17833b}.warn{background:#fff0f0;color:#c33}button{cursor:pointer}.primary{background:#222;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700}input,select{padding:9px;border:1px solid #ddd;border-radius:9px;width:100%;margin:5px 0 10px}.hidden{display:none}.list{display:flex;flex-direction:column;gap:8px}.person{display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid #eee;border-radius:10px}.danger{color:#d33;border:0;background:none}.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:flex-end;z-index:10}.sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:20px;max-height:80vh;overflow:auto}</style></head>
<body><header><h1>シフト管理</h1><div class="tabs"><button class="tab active" onclick="show('schedule',this)">月間シフト</button><button class="tab" onclick="show('requests',this)">希望シフト</button><button class="tab" onclick="show('staff',this)">スタッフ</button></div></header><main>
<section id="schedule"><div class="card month"><button onclick="move(-1)">‹</button><strong id="title"></strong><button onclick="move(1)">›</button></div><div class="card" id="shortage"></div><div class="card grid"><table class="table"><thead id="head"></thead><tbody id="body"></tbody></table></div></section>
<section id="requests" class="hidden"><div class="card"><h2>希望シフト</h2><p>スタッフが希望を提出し、管理者が確定する想定の試運転版です。</p><div id="req"></div></div></section>
<section id="staff" class="hidden"><div class="card"><h2>スタッフ一覧</h2><div id="staff" class="list"></div><hr><input id="new" placeholder="スタッフ名"><button class="primary" onclick="add()">スタッフを追加</button></div></section></main>
<div id="modal" class="modal hidden" onclick="if(event.target===this)close()"><div class="sheet"><h2 id="mt"></h2><label>勤務時間</label>

5</option><option value="13:30">13:30</option><option value="13:45">13:45</option><option value="14:00">14:00</option><option value="14:15">14:15</option><option value="14:30">14:30</option><option value="14:45">14:45</option><option value="15:00">15:00</option><option value="15:15">15:15</option><option value="15:30">15:30</option><option value="15:45">15:45</option><option value="16:00">16:00</option><option value="16:15">16:15</option><option value="16:30">16:30</option><option value="16:45">16:45</option><option value="17:00">17:00</option><option value="17:15">17:15</option><option value="17:30">17:30</option><option value="17:45">17:45</option><option value="18:00">18:00</option><option value="18:15">18:15</option><option value="18:30">18:30</option><option value="18:45">18:45</option><option value="19:00">19:00</option><option value="19:15">19:15</option><option value="19:30">19:30</option><option value="19:45">19:45</option><option value="20:00">20:00</option><option value="20:15">20:15</option><option value="20:30">20:30</option><option value="20:45">20:45</option><option value="21:00">21:00</option><option value="21:15">21:15</option><option value="21:30">21:30</option><option value="21:45">21:45</option><option value="22:00">22:00</option><option value="22:15">22:15</option><option value="22:30">22:30</option><option value="22:45">22:45</option><option value="23:00">23:00</option><option value="23:15">23:15</option><option value="23:30">23:30</option><option value="23:45">23:45</option><option value="00:00">00:00</option><option value="00:15">00:15</option><option value="00:30">00:30</option><option value="00:45">00:45</option><option value="01:00">01:00</option><option value="01:15">01:15</option><option value="01:30">01:30</option><option value="01:45">01:45</option><option value="02:00">02:00</option><option value="02:15">02:15</option><option value="02:30">02:30</option><option value="02:45">02:45</option><option value="03:00">03:00</option><option value="03:15">03:15</option><option value="03:30">03:30</option><option value="03:45">03:45</option><option value="04:00">04:00</option><option value="04:15">04:15</option><option value="04:30">04:30</option><option value="04:45">04:45</option><option value="05:00">05:00</option><option value="05:15">05:15</option><option value="05:30">05:30</option><option value="05:45">05:45</option><option value="LAST">LAST</option></select>

<div style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px">
<button type="button" onclick="preset('','')">休み</button>
<button type="button" onclick="preset('18:00','')">18時〜</button>
<button type="button" onclick="preset('20:00','')">20時〜</button>
<button type="button" id="lastBtn" onclick="setLast()">LAST</button>
</div>
<button class="primary" onclick="save()">保存</button> <button onclick="close()">キャンセル</button></div></div>
<script>
function fillTimes(){
  const make = (el, includeLast=false) => {
    let html='<option value="">選択</option>';
    for(let h=0;h<=29;h++){
      for(let m=0;m<60;m+=15){
        const total=h*60+m, hh=String(Math.floor(total/60)%24).padStart(2,'0'), mm=String(total%60).padStart(2,'0');
        html += '<option value="'+hh+':'+mm+'">'+hh+':'+mm+'</option>';
      }
    }
    if(includeLast) html += '<option value="LAST">LAST</option>';
    el.innerHTML=html;
  };
  make(document.getElementById('start'));
  make(document.getElementById('end'),true);
}
const K='shift_demo';let S=JSON.parse(localStorage.getItem(K)||'null')||{staff:['葵','太郎','花子','健','美咲'],shifts:{},req:{}};let dt=new Date();dt.setDate(1),edit=null;
function key(d){return dt.getFullYear()+'-'+(dt.getMonth()+1)+'-'+d}function days(){return new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate()}function persist(){localStorage.setItem(K,JSON.stringify(S))}
function render(){title.textContent=dt.getFullYear()+'年'+(dt.getMonth()+1)+'月';let h='<tr><th>スタッフ</th>';for(let d=1;d<=days();d++)h+='<th>'+d+'</th>';head.innerHTML=h+'</tr>';let b='';S.staff.forEach(s=>{b+='<tr><td class="name">'+s+'</td>';for(let d=1;d<=days();d++){let v=S.shifts[s+'|'+key(d)]||'';b+='<td onclick="openEdit(''+s.replaceAll("'","")+'',''+key(d)+'')">'+(v?'<span class="shift">'+v+'</span>':'<span class="off">—</span>')+'</td>'}b+='</tr>'});body.innerHTML=b;let bad=[];for(let d=1;d<=days();d++){let n=S.staff.filter(s=>S.shifts[s+'|'+key(d)]).length;if(n<2)bad.push(d+'日（'+n+'人）')}shortage.innerHTML=bad.length?'<span class="badge warn">⚠ 人数不足</span> '+bad.join('・'):'<span class="badge ok">✓ 人数不足なし</span>';renderStaff();req.innerHTML=S.staff.map(s=>'<div class="person"><span>'+s+'</span><button onclick="submitReq(\''+s+'\')">希望を提出</button></div>').join('')}
function openEdit(s,k){edit={s,k};mt.textContent=s+'｜'+k;let v=S.shifts[s+'|'+k]||'';let m=v.match(/(\\d{2}:\\d{2}).*?(\\d{2}:\\d{2})/);start.value=m?m[1]:'';end.value=m?m[2]:'';modal.classList.remove('hidden')}
function preset(a,b){start.value=a;end.value=b;document.getElementById('lastBtn').style.fontWeight='700'}function setLast(){end.value='LAST';document.getElementById('lastBtn').style.fontWeight='900';document.getElementById('lastBtn').textContent='✓ LAST'}function close(){modal.classList.add('hidden')}function save(){let k=edit.s+'|'+edit.k;if(start.value&&end.value)S.shifts[k]=start.value+'〜'+end.value;else if(start.value)S.shifts[k]=start.value+'〜';else delete S.shifts[k];persist();close();render()}function move(x){dt.setMonth(dt.getMonth()+x);render()}
function renderStaff(){staff.innerHTML=S.staff.map((s,i)=>'<div class="person"><span>'+s+'</span><button class="danger" onclick="removeStaff('+i+')">削除</button></div>').join('')}function add(){let x=new.value.trim();if(!x)return;if(!S.staff.includes(x))S.staff.push(x);new.value='';persist();render()}function removeStaff(i){if(confirm(S.staff[i]+'さんを削除しますか？')){S.staff.splice(i,1);persist();render()}}function submitReq(s){let x=prompt(s+'さんの希望日を入力（例：5,6,12）');if(x!==null){S.req[s]=x;persist();alert('希望シフトを提出しました');}}
function show(id,btn){['schedule','requests','staff'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}fillTimes();render();
</script></body></html>
