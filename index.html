<script>
const SUPABASE_URL='https://eroyuafrsntfszvoplrv.supabase.co';
const SUPABASE_KEY='sb_publishable_TJT6cTkWmPHsjMBusx0r0w__x3f77yG';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,currentStaff=null,state={staff:[],shifts:{},requests:{},confirmed:{},closed:{},weekendLike:{},memos:{},newcomers:{},roles:{},periods:[],submissions:[]};
let viewDate=new Date();viewDate.setDate(1),requestDate=new Date(viewDate);let editing=null,shortagePeriod='first',reviewMode='date',reviewDate=null,selectedPeriodId='',statusPeriodId='',editingPeriodId='',lastRequestPeriodId='';let requestSaving={};let submittingRequest=false;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function key(s,d){return s+'|'+d}function dk(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')}

function timeOptions(last=false){let a=['<option value="">選択</option>'];for(let t=15*60;t<=23*60+45;t+=15){let h=Math.floor(t/60),m=t%60,v=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');a.push(`<option value="${v}">${v}</option>`)}for(let t=0;t<=180;t+=15){let h=Math.floor(t/60),m=t%60,v=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');a.push(`<option value="${v}">${v}</option>`)}if(last)a.push('<option value="LAST">LAST</option>');return a.join('')}

// Supabase RESTの既定取得上限(通常1000件)を超える希望も欠落させず読み込む。
async function fetchAllShiftRequests(){
  const all=[];
  const pageSize=500;
  for(let from=0;;from+=pageSize){
    const {data,error}=await sb.from('shift_requests').select('*')
      .order('shift_date',{ascending:true})
      .order('staff_id',{ascending:true})
      .range(from,from+pageSize-1);
    if(error)throw error;
    const page=data||[];
    all.push(...page);
    if(page.length<pageSize)break;
  }
  return all;
}
let loadAppVersion=0;
async function loadApp(){
  if(!currentUser?.id)return;
  const version=++loadAppVersion;
  try{
    const {data:me,error:meError}=await sb.from('staff').select('*').eq('user_id',currentUser.id).eq('active',true).maybeSingle();
    if(version!==loadAppVersion)return;
    if(meError)throw meError;
    if(!me){showAuth();msg('スタッフ登録が見つかりません。アカウント登録から名前を登録してください。');return;}
    const {data:staff,error:e1}=await sb.from('staff').select('*').eq('active',true).order('created_at');
    if(e1)throw e1;
    const {data:sh,error:e2}=await sb.from('shifts').select('*');
    if(e2)throw e2;

    const {data:memos,error:e5}=await sb.from('shift_memos').select('*');

    const {data:periods,error:periodError}=await sb.from('shift_request_periods').select('*').order('period_start',{ascending:false});
    if(periodError)console.error('period load',periodError.message);
    const {data:submissions,error:submissionError}=await sb.from('shift_request_submissions').select('*');
    if(submissionError)console.error('submission load',submissionError.message);
    // 途中で開始された新しい読込があれば、古い結果で画面を上書きしない。
    if(version!==loadAppVersion)return;
    currentStaff=me;
    const activeStaff=staff||[];
    const next={staff:activeStaff,shifts:{},requests:{},confirmed:{},closed:{},weekendLike:{},memos:{},newcomers:{},roles:{},periods:periods||[],submissions:submissions||[]};
    activeStaff.forEach(x=>{next.newcomers[x.name]=!!x.role?.includes('新人');next.roles[x.name]=x.role||'バイト';});
    const staffById=new Map(activeStaff.map(x=>[x.id,x]));
    (sh||[]).forEach(r=>{const person=staffById.get(r.staff_id);if(!person)return;const v=r.status==='off'?'休み':r.start_time?(r.start_time.slice(0,5)+'〜'+(r.is_last?'LAST':r.end_time?r.end_time.slice(0,5):'')):'';if(v){next.shifts[key(person.name,r.shift_date)]=v;if(r.status==='confirmed')next.confirmed[key(person.name,r.shift_date)]=v;}});
    (req||[]).forEach(r=>{const person=staffById.get(r.staff_id);if(person)next.requests[key(person.name,r.shift_date)]={status:r.status,start:r.start_time?.slice(0,5)||'',end:r.is_last?'LAST':r.end_time?.slice(0,5)||'',submitted:true,id:r.id};});
    (dates||[]).forEach(r=>{next.closed[r.date]=!!r.is_closed;next.weekendLike[r.date]=!!r.weekend_like;});
    (memos||[]).forEach(r=>{const month=r.memo_date.slice(0,7);(next.memos[month]??=[]).push({id:r.id,text:r.text});});
    state=next;
    $('authView').classList.add('hidden');$('appView').classList.remove('hidden');$('main').classList.toggle('isAdmin',!!currentStaff.is_admin);$('roleText').textContent=currentStaff.is_admin?'管理者モード':'スタッフモード';$('userPill').textContent=currentStaff.name;
    render();startRealtime();
  }catch(e){
    if(version===loadAppVersion){console.error('loadApp failed',e);alert('データの読み込みに失敗しました。通信状況を確認してください。\n'+(e?.message||e));}
  }
}
async function refresh(){await loadApp()}

function renderSchedule(){let y=viewDate.getFullYear(),m=viewDate.getMonth();$('title').textContent=y+'年'+(m+1)+'月';let h='<tr><th>スタッフ</th>';for(let d=1;d<=days(y,m);d++){let k=dk(y,m,d),w=['日','月','火','水','木','金','土'][new Date(y,m,d).getDay()];h+=`<th><button class="dateClosedBtn ${state.closed[k]?'closed':''} ${state.weekendLike[k]?'weekendLike':''}" onclick="${currentStaff.is_admin?`toggleDate(${d})`:'void(0)'}">${d}日(${w})<small>${state.closed[k]?'休業':state.weekendLike[k]?'週末扱い':currentStaff.is_admin?'設定':''}</small></button></th>`}$('head').innerHTML=h+'</tr>';let b='';state.staff.forEach(s=>{b+=`<tr><td class="name">${esc(s.name)}${state.newcomers[s.name]?' 🔰':''}${s.role==='社員'?' <span class="mini">社員</span>':''}</td>`;for(let d=1;d<=days(y,m);d++){let k=dk(y,m,d),v=state.confirmed[key(s.name,k)]||state.shifts[key(s.name,k)]||'';let cell=state.closed[k]?'<span class="shift">休業</span>':v?`<span class="shift">${esc(v)}</span>`:'<span class="off">—</span>';b+=`<td ${currentStaff.is_admin&&!state.closed[k]?`onclick="openMonthlyEdit('${s.id}','${k}')" class="editableCell" title="タップして変更"`:''}>${cell}</td>`}b+='</tr>'});$('body').innerHTML=b;let bad=[];for(let d=1;d<=days(y,m);d++){let inP=shortagePeriod==='all'||shortagePeriod==='first'&&d<=15||shortagePeriod==='second'&&d>=16;if(!inP)continue;let k=dk(y,m,d);if(state.closed[k])continue;let day=new Date(y,m,d).getDay(),week=day===0||day===5||day===6||state.weekendLike[k],req=week?4:3,lastReq=week?2:1;let workers=state.staff.filter(s=>s.role!=='社員').map(s=>state.shifts[key(s.name,k)]||'').filter(Boolean);let n=workers.filter(v=>v!=='休み').length,last=workers.filter(v=>v==='LAST'||v.endsWith('〜LAST')).length;let x=[];if(n<req)x.push('ホール'+(req-n)+'人不足');if(last<lastReq)x.push('ラスト'+(lastReq-last)+'人不足');if(x.length)bad.push(fmtDate(k)+' '+x[0]+(x[1]?'（'+x[1]+'）':''));}$('shortage').innerHTML=bad.length?'<span class="badge warn">⚠ 人数不足</span> '+bad.join('・'):'<span class="badge ok">✓ 人数OK</span>';$('shortageFirst').c async function saveRequestRow(k,payload){
  if(!currentStaff?.id){alert('スタッフ情報を確認できません。いったんログインし直してください。');return false;}
  if(requestSaving[k])return false;
  requestSaving[k]=true;
  // 入力操作より前から動いている読込が、編集中の画面を巻き戻さないよう無効化。
  loadAppVersion++;
  const stateKey=key(currentStaff.name,k);
  const previous=state.requests[stateKey]?{...state.requests[stateKey]}:undefined;
  const optimistic={status:payload.status,start:payload.start_time?.slice(0,5)||'',end:payload.is_last?'LAST':payload.end_time?.slice(0,5)||'',submitted:true,id:previous?.id};
  // タップ直後に選択色と時間欄を更新し、通信待ちの間も操作結果を見えるようにする。
  state.requests[stateKey]=optimistic;
  renderRequestDays();
  try{
    const row={staff_id:currentStaff.id,shift_date:k,...payload};
    const {data,error}=await sb.from('shift_requests').upsert(row,{onConflict:'staff_id,shift_date'}).select().single();
    if(error){
      if(previous)state.requests[stateKey]=previous;else delete state.requests[stateKey];
      renderRequestDays();
      console.error('shift request save failed',error);
      alert('希望を保存できませんでした。\n'+error.message);
      return false;
    }
    // 保存前に開始された古い読込が、保存済みの状態を巻き戻さないよう無効化。
    loadAppVersion++;
    state.requests[stateKey]={status:data.status,start:data.start_time?.slice(0,5)||'',end:data.is_last?'LAST':data.end_time?.slice(0,5)||'',submitted:true,id:data.id};
    renderRequestDays();
    return true;
  }catch(e){
    if(previous)state.requests[stateKey]=previous;else delete state.requests[stateKey];
    renderRequestDays();
    console.error('shift request save exception',e);
    alert('希望の保存中にエラーが発生しました。\n'+(e?.message||e));
    return false;
  }finally{
    delete requestSaving[k];
  }
}
async function setRequest(k,status){
  const existing=state.requests[key(currentStaff.name,k)]||{};
  const payload={status,start_time:null,end_time:null,is_last:false,note:null};
  if(status==='work'){
    payload.start_time=existing.start||null;
    payload.end_time=existing.end==='LAST'?null:existing.end||null;
    payload.is_last=existing.end==='LAST';
  }
  await saveRequestRow(k,payload);
}
async function requestTime(k,type,v){
  if(v==='')return;
  const r=state.requests[key(currentStaff.name,k)]||{};
  if(r.status!=='work'){alert('先に「出勤」を選択してください');return;}
  const next={start:r.start||null,end:r.end||null};
  next[type]=v;
  await saveRequestRow(k,{
    status:'work',
    start_time:next.start||null,
    end_time:next.end&&next.end!=='LAST'?next.end:null,
    is_last:next.end==='LAST',
    note:null
  });
}
async function submitAllRequests(){
  if(submittingRequest)return;
  if(!selectedPeriodId){alert('提出期間が設定されていません。管理者に確認してください。');return;}
  const period=state.periods.find(p=>p.id===selectedPeriodId);
  if(!period){alert('提出期間を選び直してください。');return;}
  const existing=state.submissions.find(x=>x.period_id===period.id&&x.staff_id===currentStaff.id);
  if(existing){alert('この期間は提出済みの記録があります。希望内容を確認・修正する場合は管理者に相談してください。');return;}
  submittingRequest=true;
  try{
    // 画面上のキャッシュではなく、DBに保存済みの最新データを取得して確認する。
    const {data:rows,error:readError}=await sb.from('shift_requests').select('shift_date,status,start_time').eq('staff_id',currentStaff.id).gte('shift_date',period.period_start).lte('shift_date',period.period_end);
    if(readError){alert('保存内容を確認できませんでした。通信状況を確認して、もう一度お試しください。\n'+readError.message);return;}
    const saved=new Map((rows||[]).map(r=>[r.shift_date,r]));
    const missing=[];
    const [sy,sm,sd]=period.period_start.split('-').map(Number),[ey,em,ed]=period.period_end.split('-').map(Number);
    const cursor=new Date(sy,sm-1,sd),last=new Date(ey,em-1,ed);
    while(cursor<=last){
      const k=dk(cursor.getFullYear(),cursor.getMonth(),cursor.getDate());
      if(!state.closed[k]){
        const r=saved.get(k);
        if(!r||!['work','off'].includes(r.status)||(currentStaff.role!=='社員'&&r.status==='work'&&!r.start_time))missing.push(k);
      }
      cursor.setDate(cursor.getDate()+1);
    }
    if(missing.length){
      alert(`まだ保存されていない希望日があります。\n\n未入力・未保存：${missing.length}日\n${missing.slice(0,10).map(fmtDate).join('、')}${missing.length>10?` ほか${missing.length-10}日`:''}\n\n該当日をもう一度入力してから提出してください。`);
      return;
    }
    const today=new Date();today.setHours(0,0,0,0);const deadline=new Date(period.deadline+'T00:00:00');
    if(today>deadline&&!confirm('提出締切日を過ぎています。それでも提出しますか？'))return;
    const {error}=await sb.from('shift_request_submissions').insert({period_id:period.id,staff_id:currentStaff.id});
    if(error){if(String(error.code)==='23505'){alert('この期間はすでに提出済みです😊');await refresh();return;}alert('提出状況の保存に失敗しました。\n'+error.message);return;}
    await refresh();alert('希望内容がデータベースに保存されていることを確認して、提出を記録しました！😊');
  }catch(e){alert('提出処理中にエラーが発生しました。\n'+(e?.message||e));}
  finally{submittingRequest=false;}
}

function renderRequestReview(){

  let m=v.match(/^(\d{2}:\d{2})〜(.*)$/);
  editing={staffId,shiftDate:k,status:v==='休み'?'off':'confirmed',start:m?.[1]||'',end:m?.[2]||'',fromRequest:false};
  openEditModal(`${st.name} ${fmtDate(k)}を変更`,editing);
}
function openEditModal(title,x){
  $('modalTitle').textContent=title;
  $('start').value=x.start||'';$('end').value=x.end||'';
  $('modal').classList.remove('hidden');
}
async function saveShift(){
  if(!editing||!currentStaff?.is_admin){closeModal();return}
  let status=editing.status==='off'?'off':'confirmed',start=$('start').value||null,end=$('end').value||null,isLast=end==='LAST';
  if(status!=='off'&&!start){alert('開始時間を選択してください');return}
  const {error}=await sb.from('shifts').upsert({staff_id:editing.staffId,shift_date:editing.shiftDate,status,start_time:status==='off'?null:start,end_time:status==='off'||isLast?null:end,is_last:status==='off'?false:isLast,updated_at:new Date().toISOString()},{onConflict:'staff_id,shift_date'});
  if(error){alert(error.message);return}
  closeModal();await refresh();
}
function quickSet(v){
  if(!editing)return;
  if(v==='休み'){editing.status='off';$('start').value='';$('end').value='';return}
  editing.status='confirmed';
  if(v==='18:00〜'){$('start').value='18:00';$('end').value='';}
  if(v==='20:00〜'){$('start').value='20:00';$('end').value='';}
  if(v==='LAST'){$('start').value='18:00';$('end').value='LAST';}
}
function renderStaff(){if(!currentStaff?.is_admin)return;$('staffList').innerHTML=state.staff.map(s=>`<div class="staffRow"><div><b>${state.newcomers[s.name]?'🔰 ':''}${esc(s.name)}</b><div class="mini">${s.role||'バイト'} ${s.is_admin?'・管理者':''}</div></div><button class="secondary" onclick="renameStaff('${s.id}','${esc(s.name)}')">名前変更</button><button class="newcomerBtn" onclick="toggleNewcomer('${s.id}',${!state.newcomers[s.name]})">${state.newcomers[s.name]?'新人解除':'新人にする'}</button><button class="roleBtn ${s.role==='社員'?'admin':''}" onclick="toggleRole('${s.id}','${s.role==='社員'?'バイト':'社員'}')">${s.role==='社員'?'社員→バイト':'バイト→社員'}</button><button class="deleteStaffBtn" onclick="deleteStaff('${s.id}','${esc(s.name)}')">削除</button></div>`).join('')}
async function toggleNewcomer(id,v){await sb.from('staff').update({role:v?'新人':'バイト'}).eq('id',id);await refresh()}
async function toggleRole(id,role){await sb.from('staff').update({role}).eq('id',id);await refresh()}
async function renameStaff(id,currentName){
  if(!currentStaff?.is_admin)return;
  const n=prompt('新しいスタッフ名',currentName);
  if(n===null)return;
  const name=n.trim();
  if(!name||name===currentName)return;
  const {error}=await sb.from('staff').update({name}).eq('id',id);
  if(error)alert(error.message);else await refresh();
}
async function deleteStaff(id,name){
  if(!currentStaff?.is_admin)return;
  if(!confirm(`${name}さんをスタッフ一覧から削除しますか？\n過去のシフトデータは残ります。`))return;
  const {error}=await sb.from('staff').update({active:false}).eq('id',id);
  if(error)alert(error.message);else await refresh();
}
async function addStaff(){return adminCreateStaff()}
async function adminCreateStaff(){
  if(!currentStaff?.is_admin){alert('管理者としてログインしてください');return}
  const name=$('adminNewName').value.trim();
  const email=$('adminNewEmail').value.trim();
  const password=$('adminNewPassword').value;
  const role=$('adminNewRole').value;
  const box=$('adminStaffMessage');
  box.classList.add('hidden');
  if(!name||!email||!password){box.textContent='名前・メールアドレス・パスワードを入力してください';box.classList.remove('hidden');return}
  if(password.length<6){box.textContent='パスワードは6文字以上にしてください';box.classList.remove('hidden');return}
  const {data:{session}}=await sb.auth.getSession();
  if(!session){box.textContent='管理者としてログインし直してください';box.classList.remove('hidden');return}
  box.textContent='登録中…';box.classList.remove('hidden');
  try{
    const res=await fetch(SUPABASE_URL+'/functions/v1/admin-create-staff',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({name,email,password,role})});
    const text=await res.text();
    let out={};try{out=JSON.parse(text)}catch(e){out={error:text}}
    if(!res.ok||out.error){box.textContent=out.error||'登録に失敗しました';return}
    box.textContent=out.message||'登録しました';
    $('adminNewName').value='';$('adminNewEmail').value='';$('adminNewPassword').value='';
    await refresh();
  }catch(e){
    box.textContent='通信エラー：'+(e?.message||e);
  }
}
function initTimes(){$('start').innerHTML=timeOptions();$('end').innerHTML=timeOptions(true)}
function closeModal(){$('modal').classList.add('hidden');editing=null}
let realtimeChannel=null;
function startRealtime(){
  if(realtimeChannel)sb.removeChannel(realtimeChannel);
  realtimeChannel=sb.channel('shift-management-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'shifts'},()=>refresh())
    .on('postgres_changes',{event:'*',schema:'public',table:'shift_requests'},(payload)=>{const changedId=payload.new?.staff_id||payload.old?.staff_id;if(changedId&&changedId===currentStaff?.id)return;refresh();})
    .on('postgres_changes',{event:'*',schema:'public',table:'shop_dates'},()=>refresh())
    .on('postgres_changes',{event:'*',schema:'public',table:'shift_request_periods'},()=>refresh())
    .on('postgres_changes',{event:'*',schema:'public',table:'shift_request_submissions'},()=>refresh())
    .subscribe();
}
initTimes();
boot();
// 5秒ごとの全画面再読み込みは、スマホで操作中のボタンや時間選択欄を
// DOMごと置き換えてタップを無効化するため停止。変更通知はRealtimeで受信する。
</script></body></html>
